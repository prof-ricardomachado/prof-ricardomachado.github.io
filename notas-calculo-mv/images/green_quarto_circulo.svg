<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="100%" height="100%">
  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .math-bold { font-family: 'Times New Roman', serif; font-style: italic; font-weight: bold; }

    /* Eixos */
    .axis { stroke: #374151; stroke-width: 2; }

    /* Curvas */
    .arc-c { stroke: #111827; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .seg-gamma { stroke: #4338ca; stroke-width: 3.8; fill: none; stroke-linecap: round; }

    /* Setas */
    .arrow-arc { stroke: #111827; stroke-width: 2.2; fill: none; }
    .arrow-gamma { stroke: #4338ca; stroke-width: 2.4; fill: none; }
  </style>

  <defs>
    <!-- Seta dos Eixos -->
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151" />
    </marker>

    <!-- Seta Preta para o Arco C -->
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#111827" />
    </marker>

    <!-- Seta Roxa/Azul para gamma_1 e gamma_2 -->
    <marker id="arr-gamma" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#4338ca" />
    </marker>
  </defs>

  <!-- Preenchimento suave da Região D -->
  <path d="M 80 250 L 260 250 A 180 180 0 0 0 80 70 Z" fill="#eef2ff" />

  <!-- Eixos Cartesianos -->
  <line x1="50" y1="250" x2="390" y2="250" class="axis" marker-end="url(#axis-arr)" />
  <line x1="80" y1="280" x2="80" y2="30" class="axis" marker-end="url(#axis-arr)" />
  <text x="395" y="255" class="math" font-size="19px">x</text>
  <text x="73" y="22" class="math" font-size="19px">y</text>

  <!-- 1. Arco C (Circunferência no 1º Quadrante, sentido anti-horário) -->
  <path d="M 260 250 A 180 180 0 0 0 80 70" class="arc-c" />
  
  <!-- Setas no Arco C -->
  <path d="M 230 160 L 215 138" class="arrow-arc" marker-end="url(#arr-c)" />
  <path d="M 152 87 L 132 80" class="arrow-arc" marker-end="url(#arr-c)" />

  <!-- 2. Segmento gamma_1 (descendo no eixo y até a origem) -->
  <line x1="80" y1="70" x2="80" y2="250" class="seg-gamma" />
  
  <!-- Setas em gamma_1 (duas setas para baixo como no rascunho) -->
  <line x1="80" y1="115" x2="80" y2="135" class="arrow-gamma" marker-end="url(#arr-gamma)" />
  <line x1="80" y1="185" x2="80" y2="205" class="arrow-gamma" marker-end="url(#arr-gamma)" />

  <!-- 3. Segmento gamma_2 (da origem para a direita no eixo x) -->
  <line x1="80" y1="250" x2="260" y2="250" class="seg-gamma" />
  
  <!-- Seta em gamma_2 (para a direita) -->
  <line x1="150" y1="250" x2="180" y2="250" class="arrow-gamma" marker-end="url(#arr-gamma)" />

  <!-- Rótulos -->
  <text x="145" y="180" class="math-bold" font-size="34px" fill="#312e81">D</text>
  <text x="272" y="165" class="math-bold" font-size="24px" fill="#111827">C</text>
  <text x="38" y="170" class="math-bold" font-size="26px" fill="#4338ca">γ₁</text>
  <text x="155" y="285" class="math-bold" font-size="26px" fill="#4338ca">γ₂</text>
</svg>
