<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <style>
    .axis { stroke: #374151; stroke-width: 2; marker-end: url(#axis-arrow); }
    .surface { fill: #fca5a5; fill-opacity: 0.35; stroke: #dc2626; stroke-width: 2; }
    .surface-line { stroke: #ef4444; stroke-width: 1.2; fill: none; opacity: 0.5; }
    .curve-base { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .curve-top { stroke: #7c3aed; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .fence-fill { fill: #10b981; fill-opacity: 0.25; stroke: none; }
    .fence-post { stroke: #059669; stroke-width: 1.2; opacity: 0.7; }
    .text { font-family: system-ui, sans-serif; font-size: 13px; fill: #111827; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 16px; }
  </style>
  <defs>
    <!-- Seta dos eixos cartesianos 3D -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
  </defs>

  <!-- Eixos Cartesianos 3D com Origem em (140, 270) -->
  <!-- Eixo x (Perspectiva para baixo/esquerda) -->
  <line x1="140" y1="270" x2="50" y2="335" class="axis" />
  <text x="35" y="345" class="math">x</text>

  <!-- Eixo y (Perspectiva para direita) -->
  <line x1="140" y1="270" x2="480" y2="295" class="axis" />
  <text x="490" y="300" class="math">y</text>

  <!-- Eixo z (Vertical para cima) -->
  <line x1="140" y1="270" x2="140" y2="30" class="axis" />
  <text x="135" y="20" class="math">z</text>

  <!-- Superficie z = f(x,y) (Superficie ondulada no topo) -->
  <path d="M 130 150 
           C 210 60, 360 80, 480 100 
           C 440 210, 310 220, 170 190 
           C 140 180, 120 160, 130 150 Z" class="surface" />

  <!-- Linhas de Mapeamento/Grade da Superficie -->
  <path d="M 180 110 C 260 130, 370 140, 450 160" class="surface-line" />
  <path d="M 230 85 C 220 140, 210 180, 210 198" class="surface-line" />
  <path d="M 350 85 C 330 140, 320 180, 310 207" class="surface-line" />

  <!-- Cerca/Cortina Vertical (Regiao preenchida entre C e f(C(t))) -->
  <path d="M 190 310 
           C 250 350, 360 340, 420 280 
           L 420 135 
           C 360 150, 250 175, 190 155 Z" class="fence-fill" />

  <!-- Hastes Verticais da Cerca (Postes da cortina) -->
  <line x1="190" y1="310" x2="190" y2="155" class="fence-post" />
  <line x1="212" y1="322" x2="212" y2="161" class="fence-post" />
  <line x1="235" y1="332" x2="235" y2="166" class="fence-post" />
  <line x1="260" y1="340" x2="260" y2="170" class="fence-post" />
  <line x1="285" y1="344" x2="285" y2="171" class="fence-post" />
  <line x1="310" y1="342" x2="310" y2="170" class="fence-post" />
  <line x1="335" y1="335" x2="335" y2="166" class="fence-post" />
  <line x1="360" y1="322" x2="360" y2="159" class="fence-post" />
  <line x1="382" y1="307" x2="382" y2="150" class="fence-post" />
  <line x1="402" y1="294" x2="402" y2="142" class="fence-post" />
  <line x1="420" y1="280" x2="420" y2="135" class="fence-post" />

  <!-- Curva Base C no Plano xy (z=0) -->
  <path d="M 190 310 C 250 350, 360 340, 420 280" class="curve-base" />

  <!-- Traço f(C(t)) na Superficie z = f(x,y) -->
  <path d="M 190 155 C 250 175, 360 150, 420 135" class="curve-top" />

  <!-- Rotulos e Indicacoes -->
  <text x="440" y="80" class="math" fill="#dc2626">z = f(x,y)</text>
  <text x="430" y="130" class="math" fill="#7c3aed">f(C(t))</text>
  <text x="430" y="285" class="math" fill="#2563eb">C</text>
  <text x="290" y="250" class="math" fill="#047857" font-size="20px" font-weight="bold">A</text>
</svg>
