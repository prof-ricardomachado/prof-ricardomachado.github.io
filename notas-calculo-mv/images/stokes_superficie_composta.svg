<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 370" width="100%" height="100%">
  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .math-bold { font-family: 'Times New Roman', serif; font-style: italic; font-weight: bold; }
    .text-note { font-family: system-ui, sans-serif; font-size: 19px; fill: #1e1b4b; font-weight: 600; }

    /* Superfícies */
    .surf-1 { fill: url(#hatch-s1); stroke: #7e22ce; stroke-width: 3; stroke-linejoin: round; }
    .surf-2 { fill: url(#hatch-s2); stroke: #1e1b4b; stroke-width: 3; stroke-linejoin: round; }
    .surf-3 { fill: url(#hatch-s3); stroke: #dc2626; stroke-width: 3; stroke-linejoin: round; }

    /* Costuras / Bordos Internos */
    .seam-line { stroke: #374151; stroke-width: 2.2; fill: none; }

    /* Vetores Normais */
    .normal-vec-purp { stroke: #7e22ce; stroke-width: 2.8; fill: none; }
    .normal-vec-dark { stroke: #1e1b4b; stroke-width: 2.8; fill: none; }
    .normal-vec-red  { stroke: #dc2626; stroke-width: 2.8; fill: none; }

    /* Setas Indicadoras */
    .arr-p { stroke: #7e22ce; stroke-width: 2.4; fill: none; }
    .arr-d { stroke: #1e1b4b; stroke-width: 2.4; fill: none; }
    .arr-r { stroke: #dc2626; stroke-width: 2.4; fill: none; }
  </style>

  <defs>
    <!-- Marcadores de Ponta de Seta -->
    <marker id="arr-purp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#7e22ce" />
    </marker>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#1e1b4b" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#dc2626" />
    </marker>

    <!-- Hachuras Verticais de S1 (Violeta) -->
    <pattern id="hatch-s1" width="13" height="13" patternTransform="rotate(90 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="13" stroke="#c084fc" stroke-width="1.8" />
    </pattern>

    <!-- Hachuras Inclinadas de S2 (Azul/Índigo) -->
    <pattern id="hatch-s2" width="14" height="14" patternTransform="rotate(65 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#818cf8" stroke-width="1.8" />
    </pattern>

    <!-- Hachuras Inclinadas de S3 (Vermelho) -->
    <pattern id="hatch-s3" width="14" height="14" patternTransform="rotate(-35 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#f87171" stroke-width="1.8" />
    </pattern>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. RETALHOS DE SUPERFÍCIE (S1, S2, S3)                            -->
  <!-- ================================================================= -->

  <!-- S1: Retalho Esquerdo -->
  <path d="M 40 185 
           C 95 100, 175 90, 245 135 
           L 215 255 
           C 155 245, 95 230, 40 185 Z" class="surf-1" />

  <!-- S2: Retalho Central -->
  <path d="M 245 135 
           C 305 180, 365 155, 415 95 
           L 460 265 
           C 375 315, 295 300, 215 255 Z" class="surf-2" />

  <!-- S3: Retalho Direito -->
  <path d="M 415 95 
           L 615 185 
           L 560 320 
           L 460 265 Z" class="surf-3" />

  <!-- Linhas de Costura / Fronteiras Internas Compartilhadas -->
  <line x1="245" y1="135" x2="215" y2="255" class="seam-line" />
  <line x1="415" y1="95" x2="460" y2="265" class="seam-line" />

  <!-- ================================================================= -->
  <!-- 2. ORIENTAÇÕES NOS BORDOS EXTERNOS                                -->
  <!-- ================================================================= -->

  <!-- Bordos de S1 -->
  <path d="M 160 98 L 135 103" class="arr-p" marker-end="url(#arr-purp)" />
  <path d="M 50 170 L 46 182" class="arr-p" marker-end="url(#arr-purp)" />
  <path d="M 105 228 L 130 236" class="arr-p" marker-end="url(#arr-purp)" />

  <!-- Bordos de S2 -->
  <path d="M 330 174 L 350 167" class="arr-d" marker-end="url(#arr-dark)" />
  <path d="M 345 303 L 375 298" class="arr-d" marker-end="url(#arr-dark)" />

  <!-- Bordos de S3 -->
  <path d="M 500 133 L 525 145" class="arr-r" marker-end="url(#arr-red)" />
  <path d="M 598 232 L 588 258" class="arr-r" marker-end="url(#arr-red)" />
  <path d="M 525 302 L 495 288" class="arr-r" marker-end="url(#arr-red)" />

  <!-- ================================================================= -->
  <!-- 3. CANCELAMENTO NAS FRONTEIRAS INTERNAS COMUNS                    -->
  <!-- ================================================================= -->

  <!-- Costura 1 (entre S1 e S2): setas opostas -->
  <!-- S1 sobe pelo bordo comum -->
  <line x1="225" y1="215" x2="234" y2="175" class="arr-p" marker-end="url(#arr-purp)" />
  <!-- S2 desce pelo bordo comum -->
  <line x1="239" y1="170" x2="230" y2="210" class="arr-d" marker-end="url(#arr-dark)" />

  <!-- Costura 2 (entre S2 e S3): setas opostas -->
  <!-- S2 sobe pelo bordo comum -->
  <line x1="434" y1="210" x2="424" y2="165" class="arr-d" marker-end="url(#arr-dark)" />
  <!-- S3 desce pelo bordo comum -->
  <line x1="445" y1="165" x2="455" y2="210" class="arr-r" marker-end="url(#arr-red)" />

  <!-- ================================================================= -->
  <!-- 4. VETORES NORMAIS (N) EM CADA PARTE                              -->
  <!-- ================================================================= -->

  <!-- Vetor normal em S1 -->
  <line x1="160" y1="170" x2="160" y2="80" class="normal-vec-purp" marker-end="url(#arr-purp)" />
  <line x1="153" y1="170" x2="167" y2="170" stroke="#7e22ce" stroke-width="2" />
  <text x="170" y="80" class="math-bold" font-size="22px" fill="#7e22ce">N⃗</text>

  <!-- Vetor normal em S2 -->
  <line x1="335" y1="230" x2="365" y2="140" class="normal-vec-dark" marker-end="url(#arr-dark)" />
  <line x1="327" y1="227" x2="341" y2="234" stroke="#1e1b4b" stroke-width="2" />
  <text x="375" y="145" class="math-bold" font-size="22px" fill="#1e1b4b">N⃗</text>

  <!-- Vetor normal em S3 -->
  <line x1="510" y1="230" x2="565" y2="145" class="normal-vec-red" marker-end="url(#arr-red)" />
  <line x1="504" y1="224" x2="517" y2="234" stroke="#dc2626" stroke-width="2" />
  <text x="575" y="150" class="math-bold" font-size="22px" fill="#dc2626">N⃗</text>

  <!-- ================================================================= -->
  <!-- 5. RÓTULOS DAS SUPERFÍCIES E BORDOS                               -->
  <!-- ================================================================= -->

  <text x="135" y="165" class="math-bold" font-size="28px" fill="#581c87">S₁</text>
  <text x="315" y="240" class="math-bold" font-size="28px" fill="#1e1b4b">S₂</text>
  <text x="495" y="235" class="math-bold" font-size="28px" fill="#991b1b">S₃</text>

  <text x="60" y="270" class="math-bold" font-size="24px" fill="#7e22ce">∂S₁</text>
  <text x="330" y="340" class="math-bold" font-size="24px" fill="#1e1b4b">∂S₂</text>
  <text x="505" y="355" class="math-bold" font-size="24px" fill="#dc2626">∂S₃</text>

  <!-- Texto Final Inferior -->
  <text x="210" y="360" class="text-note">
    <tspan class="math-bold" font-size="24px">S = S₁ ∪ S₂ ∪ S₃</tspan> está orientada
  </text>
</svg>
