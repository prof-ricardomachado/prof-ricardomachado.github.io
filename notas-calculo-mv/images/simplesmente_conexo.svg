<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <style>
    .domain-border { stroke: #334155; stroke-width: 2.5; fill: url(#hatch-pattern); }
    .hole { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .curve-gamma { stroke: #dc2626; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6,6; }
    .text { font-family: system-ui, sans-serif; font-size: 14px; fill: #111827; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 18px; }
    .title-text { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
  </style>
  <defs>
    <!-- Padrão de Hachuras Diagonais -->
    <pattern id="hatch-pattern" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#cbd5e1" stroke-width="1.5" />
    </pattern>

    <!-- Seta para a Curva gamma -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Divisor Central -->
  <line x1="340" y1="30" x2="340" y2="310" class="divider" />

  <!-- ================= LADO ESQUERDO: SIMPLESMENTE CONEXO ================= -->
  <!-- Região D (Aberto sem furos) -->
  <path d="M 80 160 C 70 70, 260 60, 280 140 C 290 230, 100 260, 80 160 Z" class="domain-border" />

  <!-- Curva Fechada gamma inteiramente dentro de D -->
  <path d="M 130 150 C 130 110, 230 110, 230 160 C 230 200, 130 200, 130 150 Z" class="curve-gamma" />
  <path d="M 180 118 L 190 118" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Rótulos Lado Esquerdo -->
  <text x="245" y="220" class="math" fill="#1e293b" font-size="24px" font-weight="bold">D</text>
  <text x="180" y="110" class="math" fill="#dc2626" font-weight="bold" font-size="20px">γ</text>
  <text x="100" y="300" class="title-text">Região Simplesmente Conexa</text>

  <!-- ================= LADO DIREITO: NÃO SIMPLESMENTE CONEXO ================= -->
  <!-- Região D (Exterior com Hachura) -->
  <path d="M 400 160 C 390 60, 610 50, 620 140 C 630 230, 410 250, 400 160 Z" class="domain-border" />

  <!-- Furo Interior 1 -->
  <path d="M 450 140 C 440 110, 490 100, 500 130 C 510 160, 460 170, 450 140 Z" class="hole" />

  <!-- Furo Interior 2 -->
  <path d="M 540 175 C 530 155, 570 145, 580 165 C 590 185, 550 195, 540 175 Z" class="hole" />

  <!-- Curva Fechada gamma envolvendo o Furo 1 -->
  <path d="M 425 140 C 415 85, 525 80, 525 140 C 525 185, 425 185, 425 140 Z" class="curve-gamma" />
  <path d="M 475 92 L 485 92" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />

  <!-- Rótulos Lado Direito -->
  <text x="590" y="210" class="math" fill="#1e293b" font-size="24px" font-weight="bold">D</text>
  <text x="475" y="85" class="math" fill="#dc2626" font-weight="bold" font-size="20px">γ</text>
  <text x="415" y="300" class="title-text">Região Não Simplesmente Conexa</text>
</svg>
