<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 390" width="100%" height="100%">
  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .math-bold { font-family: 'Times New Roman', serif; font-style: italic; font-weight: bold; }
    
    /* Superfície */
    .surface { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.5; stroke-linejoin: round; }
    
    /* Curvas Coordenadas */
    .curve-u { stroke: #e11d48; stroke-width: 3; fill: none; stroke-linecap: round; }
    .curve-v { stroke: #0d9488; stroke-width: 3; fill: none; stroke-linecap: round; }
    
    /* Plano Tangente */
    .tangent-plane { fill: #38bdf8; fill-opacity: 0.22; stroke: #0284c7; stroke-width: 1.8; stroke-dasharray: 6,4; stroke-linejoin: round; }
    
    /* Vetores Tangentes */
    .vector-u { stroke: #be123c; stroke-width: 3; fill: none; }
    .vector-v { stroke: #0f766e; stroke-width: 3; fill: none; }
    
    /* Ponto */
    .pt { fill: #1e1b4b; stroke: #ffffff; stroke-width: 2; }
    .label-plane { font-family: system-ui, sans-serif; font-size: 14px; fill: #0369a1; font-weight: 600; }
  </style>

  <defs>
    <!-- Seta do Vetor Tangente u -->
    <marker id="arr-u" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#be123c" />
    </marker>

    <!-- Seta do Vetor Tangente v -->
    <marker id="arr-v" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#0f766e" />
    </marker>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. SUPERFÍCIE CURVA (S)                                           -->
  <!-- ================================================================= -->
  <path d="M 70 310 
           C 95 230, 115 160, 150 110 
           C 270 55, 430 70, 570 175 
           C 530 245, 470 300, 420 335 
           C 310 250, 190 265, 70 310 Z" class="surface" />

  <!-- Rótulo da Superfície -->
  <text x="145" y="90" class="math-bold" font-size="28px" fill="#4338ca">S</text>

  <!-- ================================================================= -->
  <!-- 2. CURVAS COORDENADAS NA SUPERFÍCIE                               -->
  <!-- ================================================================= -->

  <!-- Curva u: alpha(u, v_0) em Rosa/Vermelho -->
  <path d="M 95 200 C 160 170, 220 162, 280 170 C 360 180, 430 215, 500 265" class="curve-u" />

  <!-- Curva v: alpha(u_0, v) em Verde/Azul Petróleo -->
  <path d="M 345 74 C 320 110, 300 140, 280 170 C 265 200, 252 245, 245 285" class="curve-v" />

  <!-- ================================================================= -->
  <!-- 3. PLANO TANGENTE (PARALELOGRAMO TRANSLÚCIDO)                     -->
  <!-- ================================================================= -->
  <polygon points="230,120 450,138 360,285 140,267" class="tangent-plane" />
  <text x="380" y="275" class="label-plane">Plano Tangente</text>

  <!-- ================================================================= -->
  <!-- 4. VETORES TANGENTES NO PONTO alpha(u_0, v_0)                     -->
  <!-- ================================================================= -->

  <!-- Vetor parcial em relação a u: d(alpha)/du -->
  <line x1="280" y1="170" x2="395" y2="179" class="vector-u" marker-end="url(#arr-u)" />

  <!-- Vetor parcial em relação a v: d(alpha)/dv -->
  <line x1="280" y1="170" x2="225" y2="245" class="vector-v" marker-end="url(#arr-v)" />

  <!-- ================================================================= -->
  <!-- 5. PONTO DE INTERSEÇÃO E RÓTULOS                                  -->
  <!-- ================================================================= -->

  <!-- Ponto alpha(u_0, v_0) -->
  <circle cx="280" cy="170" r="5" class="pt" />
  <text x="272" y="155" class="math-bold" font-size="19px" fill="#1e1b4b">α(u₀, v₀)</text>

  <!-- Rótulo da Curva u -->
  <text x="510" y="278" class="math-bold" font-size="20px" fill="#be123c">α(u, v₀)</text>

  <!-- Rótulo da Curva v -->
  <text x="220" y="315" class="math-bold" font-size="20px" fill="#0f766e">α(u₀, v)</text>

  <!-- Rótulo do Vetor Tangente u -->
  <text x="405" y="175" class="math-bold" font-size="18px" fill="#be123c">
    <tspan dy="-6">∂α</tspan><tspan dy="6">/∂</tspan>u(u₀, v₀)
  </text>

  <!-- Rótulo do Vetor Tangente v -->
  <text x="130" y="235" class="math-bold" font-size="18px" fill="#0f766e">
    <tspan dy="-6">∂α</tspan><tspan dy="6">/∂</tspan>v(u₀, v₀)
  </text>
</svg>
