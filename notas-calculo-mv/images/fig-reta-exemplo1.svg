<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <style>
    .axis { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
    .grid-line { stroke: #9ca3af; stroke-dasharray: 4,4; stroke-width: 1.5; }
    .graph-line { stroke: #2563eb; stroke-width: 3; }
    .point { fill: #dc2626; }
    .text { font-family: system-ui, sans-serif; font-size: 15px; fill: #111827; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 16px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
  </defs>
  
  <!-- Eixos Cartesionos -->
  <line x1="50" y1="240" x2="350" y2="240" class="axis" />
  <line x1="120" y1="290" x2="120" y2="30" class="axis" />
  <text x="360" y="245" class="math">x</text>
  <text x="115" y="20" class="math">y</text>
  
  <!-- Linhas tracejadas (guias dos pontos) -->
  <line x1="220" y1="240" x2="220" y2="100" class="grid-line" />
  <line x1="120" y1="100" x2="220" y2="100" class="grid-line" />
  
  <!-- Valorações nos eixos -->
  <text x="216" y="260" class="text">1</text>
  <text x="100" y="105" class="text">2</text>
  
  <!-- Reta Im(f): y = 2x -->
  <line x1="85" y1="289" x2="245" y2="65" class="graph-line" />
  <text x="252" y="60" class="math" fill="#2563eb" font-weight="bold">Im(f)</text>
  
  <!-- Ponto f(0) = (0,0) -->
  <circle cx="120" cy="240" r="5" class="point" />
  <text x="128" y="258" class="math" fill="#dc2626">f(0)</text>
  
  <!-- Ponto f(1) = (1,2) -->
  <circle cx="220" cy="100" r="5" class="point" />
  <text x="230" y="98" class="math" fill="#dc2626">f(1)</text>
</svg>
