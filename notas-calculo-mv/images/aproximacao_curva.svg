    .text { font-family: system-ui, sans-serif; font-size: 13px; fill: #111827; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 16px; }
  </style>
  <defs
     id="defs1">
    <!-- Seta para indicação do mapeamento gamma -->
    <marker
       id="arrow-indigo"
       viewBox="0 0 10 10"
       refX="6"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#4f46e5"
         id="path1" />
    </marker>
  </defs>
  <!-- CURVA suave gamma -->
  <path
     d="M 70 230 C 140 80, 220 50, 300 130 C 360 190, 440 180, 490 50"
     class="curve"
     id="path2" />
  <!-- SEGMENTOS SECANTES (POLIGONAL DE APROXIMAÇÃO EM VERMELHO) -->
  <path
     id="polyline2"
     class="secant"
