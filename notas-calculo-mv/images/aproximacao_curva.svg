     sodipodi:nodetypes="cccccc" />
  <!-- PONTOS SOBRE A CURVA -->
  <!-- gamma(t_0) = gamma(a) -->
  <circle
     cx="70"
     cy="230"
     r="4"
     class="point-red"
     id="circle2" />
  <!-- gamma(t_1) -->
  <circle
     cx="143.90317"
     cy="119.22226"
     r="3.5"
     class="point-red"
     id="circle3" />
  <!-- gamma(t_{i-1}) -->
  <circle
     cx="218.77193"
     cy="87.228073"
     r="4.5"
     class="point-red"
     id="circle4" />
  <text
     x="197.5965"
     y="75.070175"
     class="math"
     fill="#dc2626"
     id="text4">γ(tᵢ₋₁)</text>
  <!-- gamma(t_i) -->
  <circle
     cx="300"
     cy="130"
     r="4.5"
     class="point-red"
     id="circle5" />
  <text
     x="304.21094"
     y="122.09375"
     class="math"
     fill="#dc2626"
     id="text5">γ(tᵢ)</text>
  <!-- gamma(t_{n-1}) -->
  <circle
     cx="410.08771"
     cy="156.07018"
     r="3.5"
     class="point-red"
     id="circle6" />
  <!-- gamma(t_n) = gamma(b) -->
  <circle
     cx="490"
     cy="50"
     r="4"
     class="point-red"
     id="circle7" />
  <!-- INDICAÇÃO DA FUNÇÃO MAPA gamma DO INTERVALO À CURVA -->
  <path
