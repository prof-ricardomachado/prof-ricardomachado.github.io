    .axis-line { stroke: #374151; stroke-width: 2; }
    .curve { stroke: #1e293b; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .secant { stroke: #dc2626; stroke-width: 2; fill: none; stroke-linecap: round; }
    .map-arrow { stroke: #4f46e5; stroke-width: 1.8; marker-end: url(#arrow-indigo); fill: none; }
    .point { fill: #1e293b; }
    .point-red { fill: #dc2626; }
