  <text
     x="232"
     y="200"
     class="math"
     fill="#4f46e5"
     font-size="20px"
     id="text7">γ</text>
  <!-- INTERVALO REAL [a, b] NA BASE -->
  <line
     x1="60"
     y1="310"
     x2="500"
     y2="310"
     class="axis-line"
     id="line7" />
  <!-- Ticks do Intervalo -->
  <line
     x1="70"
     y1="300"
     x2="70"
     y2="320"
     class="tick"
     id="line8" />
  <text
     x="50"
     y="340"
     class="math"
     id="text8">t₀ = a</text>
  <text
     x="130"
     y="300"
     class="math"
     id="text9">...</text>
  <line
     x1="200"
     y1="303"
     x2="200"
     y2="317"
     class="tick"
     id="line9" />
  <text
     x="185"
     y="340"
     class="math"
     id="text10">tᵢ₋₁</text>
  <line
     x1="260"
     y1="303"
     x2="260"
     y2="317"
     class="tick"
     id="line10" />
  <text
     x="255"
     y="340"
     class="math"
     id="text11">tᵢ</text>
  <line
     x1="420"
     y1="303"
     x2="420"
     y2="317"
     class="tick"
     id="line11" />
  <text
     x="405"
     y="340"
     class="math"
     id="text12">tₙ₋₁</text>
  <line
     x1="490"
     y1="300"
     x2="490"
     y2="320"
     class="tick"
     id="line12" />
  <text
     x="470"
     y="340"
     class="math"
     id="text13">b = tₙ</text>
</svg>
