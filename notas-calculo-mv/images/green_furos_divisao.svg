    /* Setas Indicadoras */
    .arrow-path-blk { stroke: #111827; stroke-width: 2.2; fill: none; }
    .arrow-path-purp { stroke: #7e22ce; stroke-width: 2.5; fill: none; }
    .arrow-path-blue { stroke: #312e81; stroke-width: 2.2; fill: none; }
  </style>
  <defs
