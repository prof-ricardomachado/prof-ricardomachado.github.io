<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%">
  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .math-bold { font-family: 'Times New Roman', serif; font-style: italic; font-weight: bold; }
    .axis { stroke: #374151; stroke-width: 2; }
    
    /* Domínio D no plano uv */
    .domain-fill { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.5; stroke-linejoin: round; }
    .grid-uv { stroke: #818cf8; stroke-width: 1.2; fill: none; }
    
    /* Superfície Im(alpha) no espaço xyz */
    .surface-fill { fill: #fdf4ff; stroke: #4338ca; stroke-width: 2.8; stroke-linejoin: round; }
    .grid-surface { stroke: #ea580c; stroke-width: 1.5; fill: none; }
    
    /* Mapeamento alpha */
    .map-arrow { stroke: #2563eb; stroke-width: 2.4; fill: none; }
    
    /* Pontos */
    .pt { fill: #1e1b4b; stroke: #ffffff; stroke-width: 1.5; }
  </style>

  <defs>
    <!-- Seta dos Eixos -->
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151" />
    </marker>

    <!-- Seta do Mapeamento -->
    <marker id="map-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. PLANO UV (ESQUERDA)                                            -->
  <!-- ================================================================= -->

  <!-- Eixos u e v -->
  <line x1="40" y1="260" x2="270" y2="260" class="axis" marker-end="url(#axis-arr)" />
  <line x1="70" y1="285" x2="70" y2="70" class="axis" marker-end="url(#axis-arr)" />
  <text x="275" y="265" class="math" font-size="20px">u</text>
  <text x="65" y="58" class="math" font-size="20px">v</text>

  <!-- Região D (Domínio Plano) -->
  <path d="M 115 160 
           C 105 125, 160 115, 205 135 
           C 235 150, 225 210, 185 220 
           C 140 230, 120 195, 115 160 Z" class="domain-fill" />

  <!-- Grade Coordenada em D -->
  <path d="M 116 175 Q 160 170 218 175" class="grid-uv" />
  <path d="M 125 150 Q 165 145 208 152" class="grid-uv" />
  <path d="M 130 198 Q 165 195 200 198" class="grid-uv" />
  
  <path d="M 140 135 Q 138 175 140 215" class="grid-uv" />
  <path d="M 165 125 Q 165 175 168 221" class="grid-uv" />
  <path d="M 190 132 Q 192 175 192 210" class="grid-uv" />

  <!-- Ponto (u,v) em D -->
  <circle cx="165" cy="172" r="4.5" class="pt" />
  <text x="175" y="172" class="math" font-size="17px" fill="#1e1b4b">(u, v)</text>
  <text x="132" y="145" class="math-bold" font-size="24px" fill="#4338ca">D</text>

  <!-- ================================================================= -->
  <!-- 2. FLECHA DO MAPEAMENTO ALPHA                                     -->
  <!-- ================================================================= -->
  <path d="M 235 145 C 285 95, 345 95, 415 130" class="map-arrow" marker-end="url(#map-arr)" />
  <text x="320" y="92" class="math-bold" font-size="26px" fill="#2563eb">α</text>

  <!-- ================================================================= -->
  <!-- 3. ESPAÇO XYZ E SUPERFÍCIE CURVA (DIREITA)                        -->
  <!-- ================================================================= -->

  <!-- Eixos x, y e z -->
  <!-- Eixo z (vertical) -->
  <line x1="470" y1="270" x2="470" y2="40" class="axis" marker-end="url(#axis-arr)" />
  <!-- Eixo y (horizontal para a direita) -->
  <line x1="470" y1="250" x2="725" y2="250" class="axis" marker-end="url(#axis-arr)" />
  <!-- Eixo x (vindo para frente / diagonal inferior esquerda) -->
  <line x1="470" y1="250" x2="385" y2="335" class="axis" marker-end="url(#axis-arr)" />

  <text x="463" y="30" class="math" font-size="20px">z</text>
  <text x="732" y="255" class="math" font-size="20px">y</text>
  <text x="372" y="342" class="math" font-size="20px">x</text>

  <!-- Superfície Curva Im(alpha) -->
  <!-- Vértices da superfície curva: 
       P1(445, 215), P2(535, 110), P3(700, 155), P4(590, 245) -->
  <path d="M 445 215 
           C 465 160, 495 125, 535 110 
           C 600 115, 660 135, 700 155 
           C 670 195, 635 225, 590 245 
           C 540 240, 485 230, 445 215 Z" class="surface-fill" />

  <!-- Grade de Curvas Coordenadas sobre a Superfície (Vermelho/Laranja) -->
  <!-- Curvas u = constante -->
  <path d="M 470 188 C 530 182, 595 195, 625 228" class="grid-surface" />
  <path d="M 495 158 C 555 152, 620 168, 655 202" class="grid-surface" />
  <path d="M 515 132 C 575 128, 645 145, 680 178" class="grid-surface" />

  <!-- Curvas v = constante -->
  <path d="M 475 220 C 498 185, 520 145, 555 113" class="grid-surface" />
  <path d="M 515 228 C 542 190, 565 150, 598 120" class="grid-surface" />
  <path d="M 552 238 C 580 200, 608 162, 642 130" class="grid-surface" />
  <path d="M 580 215 C 612 185, 638 160, 675 142" class="grid-surface" />

  <!-- Ponto alpha(u,v) sobre a superfície curva -->
  <circle cx="568" cy="172" r="5" class="pt" />
  <text x="580" y="174" class="math-bold" font-size="19px" fill="#1e1b4b">α(u, v)</text>

  <!-- Rótulo Im(alpha) -->
  <text x="640" y="95" class="math-bold" font-size="24px" fill="#1e1b4b">Im(α)</text>
</svg>
