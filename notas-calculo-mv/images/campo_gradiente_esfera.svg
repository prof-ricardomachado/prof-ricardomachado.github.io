  <style
     id="style1">
    .sphere-fill { fill: url(#sphere-grad); stroke: #2563eb; stroke-width: 1.8; opacity: 0.85; }
    .equator { stroke: #3b82f6; stroke-width: 1.2; fill: none; stroke-dasharray: 4,4; }
    .meridian { stroke: #3b82f6; stroke-width: 1.2; fill: none; opacity: 0.6; }
    .vector-back { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 3,3; marker-end: url(#vec-arrow-back); opacity: 0.5; }
    .vector-front { stroke: #2563eb; stroke-width: 2; marker-end: url(#vec-arrow); }
    .point { fill: #dc2626; }
    .text { font-family: system-ui, sans-serif; font-size: 13px; fill: #111827; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 16px; }
  </style>
  <defs
     id="defs4">
    <!-- Gradiente para dar efeito tridimensional à esfera -->
    <radialGradient
       id="sphere-grad"
       cx="35%"
       cy="35%"
       r="65%">
      <stop
         offset="0%"
         stop-color="#ffffff"
         id="stop1" />
      <stop
         offset="50%"
         stop-color="#dbeafe"
         id="stop2" />
      <stop
         offset="100%"
         stop-color="#93c5fd"
         id="stop3" />
    </radialGradient>
    <!-- Seta dos vetores do campo (Frente) -->
    <marker
       id="vec-arrow"
       viewBox="0 0 10 10"
       refX="7"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#2563eb"
         id="path3" />
    </marker>
    <!-- Seta dos vetores do campo (Trás/Ocultos) -->
    <marker
       id="vec-arrow-back"
       viewBox="0 0 10 10"
       refX="7"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#2563eb"
         opacity="0.5"
         id="path4" />
    </marker>
  </defs>
