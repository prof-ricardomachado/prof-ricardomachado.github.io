<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" width="100%" height="100%">
  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .math-bold { font-family: 'Times New Roman', serif; font-style: italic; font-weight: bold; }
    
    /* Eixos */
    .axis { stroke: #374151; stroke-width: 2; }
    
    /* Linhas e Círculos Auxiliares (Roxo) */
    .aux-line { stroke: #7e22ce; stroke-width: 2; fill: none; }
    .aux-text { font-family: 'Times New Roman', serif; font-size: 19px; fill: #7e22ce; font-weight: bold; }
    
    /* Fronteira de Integração C */
    .boundary-c { stroke: #111827; stroke-width: 3.5; fill: url(#hatch-d); stroke-linejoin: round; }
    .arrow-path { stroke: #111827; stroke-width: 2.2; fill: none; }
  </style>

  <defs>
    <!-- Seta dos Eixos Cartesianos -->
    <marker id="axis-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151" />
    </marker>

    <!-- Seta Preta para o Contorno C -->
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#111827" />
    </marker>

    <!-- Padrão de Hachuras para a Região D -->
    <pattern id="hatch-d" width="12" height="12" patternTransform="rotate(20 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="12" y2="0" stroke="#818cf8" stroke-width="1.8" />
    </pattern>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. CÍRCULOS E RETAS AUXILIARES (ROXO)                             -->
  <!-- ================================================================= -->
  
  <!-- Círculo r = 1 (x^2 + y^2 = 1) -->
  <path d="M 150 230 A 90 90 0 0 1 240 320" class="aux-line" stroke-width="2.2" />

  <!-- Círculo r = 2 (x^2 + y^2 = 4) -->
  <path d="M 150 140 A 180 180 0 0 1 330 320" class="aux-line" stroke-width="2.2" />

  <!-- Reta y = sqrt(3)*x (theta = 60 deg) -->
  <line x1="150" y1="320" x2="300" y2="60" class="aux-line" />

  <!-- Reta y = (sqrt(3)/3)*x (theta = 30 deg) -->
  <line x1="150" y1="320" x2="420" y2="164" class="aux-line" />


  <!-- ================================================================= -->
  <!-- 2. REGIÃO D E FRONTEIRA C (EM DESTAQUE PRETO)                     -->
  <!-- ================================================================= -->
  
  <!-- Contorno Fechado C com Hachuras -->
  <!-- Vértices: A(227.9, 275), B(305.9, 230), C(240, 164.1), D(195, 242.1) -->
  <path d="M 227.9 275 
           L 305.9 230 
           A 180 180 0 0 0 240 164.1 
           L 195 242.1 
           A 90 90 0 0 1 227.9 275 Z" class="boundary-c" />

  <!-- Setas de Sentido Anti-Horário no Contorno C -->
  <!-- 1. Segmento inferior na reta theta = 30 deg (afastando-se da origem) -->
  <line x1="250" y1="262" x2="272" y2="249" class="arrow-path" marker-end="url(#arr-c)" />

  <!-- 2. Arco externo r = 2 (subindo/sentido anti-horário) -->
  <path d="M 283 194 L 270 180" class="arrow-path" marker-end="url(#arr-c)" />

  <!-- 3. Segmento superior na reta theta = 60 deg (aproximando-se da origem) -->
  <line x1="225" y1="190" x2="210" y2="216" class="arrow-path" marker-end="url(#arr-c)" />

  <!-- 4. Arco interno r = 1 (descendo/sentido horário local para fechar o percurso) -->
  <path d="M 205 254 L 217 267" class="arrow-path" marker-end="url(#arr-c)" />


  <!-- ================================================================= -->
  <!-- 3. EIXOS CARTESIANOS                                              -->
  <!-- ================================================================= -->
  
  <line x1="100" y1="320" x2="600" y2="320" class="axis" marker-end="url(#axis-arr)" />
  <line x1="150" y1="365" x2="150" y2="25" class="axis" marker-end="url(#axis-arr)" />

  <!-- Marcações no eixo x -->
  <line x1="240" y1="320" x2="240" y2="326" stroke="#374151" stroke-width="1.8" />
  <line x1="330" y1="320" x2="330" y2="326" stroke="#374151" stroke-width="1.8" />
  
  <text x="605" y="325" class="math" font-size="19px">x</text>
  <text x="143" y="18" class="math" font-size="19px">y</text>
  <text x="135" y="342" class="math" font-size="18px">0</text>
  <text x="236" y="342" class="math" font-size="18px">1</text>
  <text x="326" y="342" class="math" font-size="18px">2</text>


  <!-- ================================================================= -->
  <!-- 4. RÓTULOS E EQUAÇÕES                                             -->
  <!-- ================================================================= -->
  
  <!-- Equações dos Círculos -->
  <text x="45" y="145" class="aux-text">x² + y² = 4</text>
  <text x="45" y="235" class="aux-text">x² + y² = 1</text>

  <!-- Equações das Retas -->
  <text x="308" y="55" class="aux-text">y = √3 x</text>
  <text x="428" y="160" class="aux-text">y = <tspan dy="-7" font-size="15px">√3</tspan><tspan dy="7" font-size="19px">/₃</tspan> x</text>

  <!-- Rótulo da Região D e Curva C -->
  <text x="236" y="232" class="math-bold" font-size="28px" fill="#1e1b4b">D</text>
  <text x="302" y="196" class="math-bold" font-size="24px" fill="#111827">C</text>
</svg>
