<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  <style>
    .axis { stroke: #374151; stroke-width: 2; marker-end: url(#axis-arrow); }
    .spiral { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .vector { stroke: #ea580c; stroke-width: 1.5; marker-end: url(#vec-arrow); opacity: 0.85; }
    .point { fill: #dc2626; }
    .text { font-family: system-ui, sans-serif; font-size: 14px; fill: #111827; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 16px; }
  </style>
  <defs>
    <!-- Seta dos eixos -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
    <!-- Seta dos vetores posicao -->
    <marker id="vec-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
    </marker>
    <!-- Seta de orientacao da curva -->
    <marker id="spiral-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Eixos Cartesianos com Origem em (250, 200) -->
  <line x1="40" y1="200" x2="480" y2="200" class="axis" />
  <line x1="250" y1="370" x2="250" y2="30" class="axis" />
  <text x="485" y="205" class="math">x</text>
  <text x="245" y="20" class="math">y</text>

  <!-- Vetores Posicao a partir da Origem (250, 200) -->
  <line x1="250" y1="200" x2="430.0" y2="200.0" class="vector" /> <!-- t = 0 -->
  <line x1="250" y1="200" x2="357.1" y2="92.9" class="vector" />  <!-- t = pi/4 -->
  <line x1="250" y1="200" x2="250.0" y2="72.6" class="vector" />  <!-- t = pi/2 -->
  <line x1="250" y1="200" x2="174.2" y2="124.2" class="vector" /> <!-- t = 3pi/4 -->
  <line x1="250" y1="200" x2="159.8" y2="200.0" class="vector" /> <!-- t = pi -->
  <line x1="250" y1="200" x2="196.4" y2="253.6" class="vector" /> <!-- t = 5pi/4 -->
  <line x1="250" y1="200" x2="250.0" y2="263.8" class="vector" /> <!-- t = 3pi/2 -->
  <line x1="250" y1="200" x2="295.2" y2="200.0" class="vector" /> <!-- t = 2pi -->

