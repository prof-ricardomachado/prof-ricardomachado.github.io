  <!-- Setas indicando a orientacao anti-horaria na curva -->
  <path d="M 338 82 L 329 79" stroke="#2563eb" stroke-width="2" marker-end="url(#spiral-arrow)" />
  <path d="M 180 116 L 176 122" stroke="#2563eb" stroke-width="2" marker-end="url(#spiral-arrow)" />
  <path d="M 210 260 L 218 262" stroke="#2563eb" stroke-width="2" marker-end="url(#spiral-arrow)" />

  <!-- Marcacao de ponto 1 no eixo x -->
  <line x1="430" y1="195" x2="430" y2="205" stroke="#374151" stroke-width="1.5" />
  <text x="426" y="222" class="text">1</text>

  <!-- Ponto g(0) -->
  <circle cx="430.0" cy="200.0" r="4.5" class="point" />
  <text x="438" y="195" class="math" fill="#dc2626">g(0)</text>

  <!-- Ponto g(pi/2) no eixo y positivo -->
  <circle cx="250.0" cy="72.6" r="4.5" class="point" />
  <text x="258" y="70" class="math" fill="#dc2626">g(π/2)</text>
</svg>
