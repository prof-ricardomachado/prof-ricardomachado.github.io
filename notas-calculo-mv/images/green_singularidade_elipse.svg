<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="100%" height="100%">
  <style>
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .math-bold { font-family: 'Times New Roman', serif; font-style: italic; font-weight: bold; }

    /* Eixos */
    .axis { stroke: #374151; stroke-width: 2; }

    /* Contorno Externo (Elipse C) */
    .ellipse-c { stroke: #111827; stroke-width: 3.2; fill: none; }
    .arrow-c { stroke: #111827; stroke-width: 2.2; fill: none; }

    /* Contorno Interno (Círculo C2 em Roxo) */
    .circle-c2 { stroke: #7e22ce; stroke-width: 3; fill: none; }
    .arrow-c2 { stroke: #7e22ce; stroke-width: 2.2; fill: none; }

    /* Ponto Singular na Origem */
    .singularity { fill: #111827; }

    /* Marcações numéricas */
    .tick-label { font-family: 'Times New Roman', serif; font-size: 19px; fill: #1f2937; }
  </style>

  <defs>
    <!-- Seta dos Eixos -->
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151" />
    </marker>

    <!-- Seta para a Elipse Externa C (Preta) -->
    <marker id="arr-c-marker" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#111827" />
    </marker>

    <!-- Seta para o Círculo Interno C2 (Roxa) -->
    <marker id="arr-c2-marker" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#7e22ce" />
    </marker>

    <!-- Padrão de Hachuras Diagonais -->
    <pattern id="hatch-d" width="16" height="16" patternTransform="rotate(35 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#818cf8" stroke-width="1.8" />
    </pattern>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. HACHURAS DA REGIÃO D                                           -->
  <!-- ================================================================= -->
  <!-- Região entre a elipse externa (a=130, b=170) e o círculo interno (r=45) -->
  <path d="M 390 240 A 130 170 0 1 0 130 240 A 130 170 0 1 0 390 240 Z
           M 305 240 A 45 45 0 1 0 215 240 A 45 45 0 1 0 305 240 Z"
        fill="url(#hatch-d)" fill-rule="evenodd" />

  <!-- Fundo branco no interior do círculo C2 -->
  <circle cx="260" cy="240" r="44" fill="#ffffff" />

  <!-- ================================================================= -->
  <!-- 2. EIXOS CARTESIANOS                                              -->
  <!-- ================================================================= -->
  <line x1="30" y1="240" x2="490" y2="240" class="axis" marker-end="url(#arr-axis)" />
  <line x1="260" y1="450" x2="260" y2="35" class="axis" marker-end="url(#arr-axis)" />
  <text x="495" y="245" class="math" font-size="20px">x</text>
  <text x="252" y="25" class="math" font-size="20px">y</text>

  <!-- ================================================================= -->
  <!-- 3. CURVAS C E C2                                                  -->
  <!-- ================================================================= -->

  <!-- Elipse Externa C -->
  <ellipse cx="260" cy="240" rx="130" ry="170" class="ellipse-c" />

  <!-- Setas de Orientação Anti-horária em C -->
  <!-- Lateral direita (subindo) -->
  <path d="M 390 205 L 388 185" class="arrow-c" marker-end="url(#arr-c-marker)" />
  <!-- Topo esquerdo (descendo/esquerda) -->
  <path d="M 195 90 L 175 105" class="arrow-c" marker-end="url(#arr-c-marker)" />
  <!-- Lateral esquerda (descendo) -->
  <path d="M 130 275 L 132 295" class="arrow-c" marker-end="url(#arr-c-marker)" />
  <!-- Base direita (subindo/direita) -->
  <path d="M 325 390 L 345 375" class="arrow-c" marker-end="url(#arr-c-marker)" />

  <!-- Círculo Interno C2 (Roxo) -->
  <circle cx="260" cy="240" r="45" class="circle-c2" />

  <!-- Setas de Orientação Horária em C2 -->
  <!-- Topo (para a direita) -->
  <path d="M 255 195 L 275 197" class="arrow-c2" marker-end="url(#arr-c2-marker)" />
  <!-- Base (para a esquerda) -->
  <path d="M 265 285 L 245 283" class="arrow-c2" marker-end="url(#arr-c2-marker)" />
  <!-- Lateral esquerda (subindo) -->
  <path d="M 215 250 L 216 230" class="arrow-c2" marker-end="url(#arr-c2-marker)" />
  <!-- Lateral direita (descendo) -->
  <path d="M 305 230 L 304 250" class="arrow-c2" marker-end="url(#arr-c2-marker)" />

  <!-- Ponto de Descontinuidade na Origem -->
  <circle cx="260" cy="240" r="3.5" class="singularity" />

  <!-- ================================================================= -->
  <!-- 4. MARCAÇÕES NUMÉRICAS NOS EIXOS E RÓTULOS                        -->
  <!-- ================================================================= -->
  <!-- Marcações dos interceptos -->
  <text x="398" y="262" class="tick-label">2</text>
  <text x="98" y="262" class="tick-label">-2</text>
  <text x="268" y="78" class="tick-label">3</text>
  <text x="268" y="420" class="tick-label">-3</text>

  <!-- Rótulos da Figura -->
  <text x="398" y="145" class="math-bold" font-size="26px" fill="#111827">C</text>
  <text x="312" y="222" class="math-bold" font-size="23px" fill="#7e22ce">C₂</text>
  <text x="195" y="190" class="math-bold" font-size="30px" fill="#1e1b4b">D</text>
</svg>
