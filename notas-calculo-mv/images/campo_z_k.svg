<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" width="100%" height="100%">
  <style>
    .axis { stroke: #374151; stroke-width: 2; marker-end: url(#axis-arrow); }
    .axis-dash { stroke: #374151; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .plane { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1.5; opacity: 0.45; }
    .vector-up { stroke: #0284c7; stroke-width: 2; marker-end: url(#arrow-up); }
    .vector-down { stroke: #0284c7; stroke-width: 2; marker-end: url(#arrow-down); }
    .point { fill: #dc2626; }
    .text { font-family: system-ui, sans-serif; font-size: 13px; fill: #111827; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 16px; }
  </style>
  <defs>
    <!-- Seta dos eixos cartesianos -->
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
    <!-- Seta dos vetores apontando para cima -->
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
    <!-- Seta dos vetores apontando para baixo -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Eixo z negativo (parte oculta/inferior) -->
  <line x1="250" y1="220" x2="250" y2="400" class="axis-dash" />

  <!-- Representacao do Plano xy (Grave em perspectiva z=0) -->
  <polygon points="120,200 280,140 380,240 220,300" class="plane" />

  <!-- Eixos Cartesianos 3D com Origem em (250, 220) -->
  <!-- Eixo x (Para baixo/esquerda) -->
  <line x1="250" y1="220" x2="110" y2="290" class="axis" />
  <text x="95" y="300" class="math">x</text>

  <!-- Eixo y (Para direita/baixo) -->
  <line x1="250" y1="220" x2="430" y2="270" class="axis" />
  <text x="440" y="275" class="math">y</text>

  <!-- Eixo z positivo (Para cima) -->
  <line x1="250" y1="220" x2="250" y2="30" class="axis" />
  <text x="245" y="20" class="math">z</text>
  <text x="235" y="235" class="math" fill="#374151">0</text>

  <!-- CAMADA z = -2 (Abaixo do plano xy - Vetores longos apontando para baixo) -->
  <!-- Pontos base z = -2 -->
  <circle cx="200" cy="305" r="3" class="point" />
  <line x1="200" y1="305" x2="200" y2="365" class="vector-down" />

  <circle cx="280" cy="285" r="3" class="point" />
  <line x1="280" y1="285" x2="280" y2="345" class="vector-down" />

  <circle cx="340" cy="310" r="3" class="point" />
  <line x1="340" y1="310" x2="340" y2="370" class="vector-down" />


  <!-- CAMADA z = -1 (Abaixo do plano xy - Vetores curtos apontando para baixo) -->
  <circle cx="200" cy="270" r="3" class="point" />
  <line x1="200" y1="270" x2="200" y2="300" class="vector-down" />

  <circle cx="280" cy="250" r="3" class="point" />
  <line x1="280" y1="250" x2="280" y2="280" class="vector-down" />

  <circle cx="340" cy="275" r="3" class="point" />
  <line x1="340" y1="275" x2="340" y2="305" class="vector-down" />


  <!-- CAMADA z = 1 (Acima do plano xy - Vetores curtos apontando para cima) -->
  <circle cx="200" cy="200" r="3" class="point" />
  <line x1="200" y1="200" x2="200" y2="170" class="vector-up" />

  <circle cx="280" cy="180" r="3" class="point" />
  <line x1="280" y1="180" x2="280" y2="150" class="vector-up" />

  <circle cx="340" cy="205" r="3" class="point" />
  <line x1="340" y1="205" x2="340" y2="175" class="vector-up" />


  <!-- CAMADA z = 2 (Acima do plano xy - Vetores longos apontando para cima) -->
  <circle cx="200" cy="165" r="3" class="point" />
  <line x1="200" y1="165" x2="200" y2="105" class="vector-up" />

  <circle cx="280" cy="145" r="3" class="point" />
  <line x1="280" y1="145" x2="280" y2="85" class="vector-up" />

  <circle cx="340" cy="170" r="3" class="point" />
  <line x1="340" y1="170" x2="340" y2="110" class="vector-up" />


  <!-- Rotulo da equacao do campo vetorial -->
  <text x="360" y="90" class="math" fill="#0284c7">F⃗(x,y,z) = z k⃗</text>
</svg>
