<span class="type">Definição</span><span class="space"> </span><span class="codenumber">2.3.4</span><span class="period">.</span>
</h4>
<div class="para">Diremos que a integral de linha <span class="process-math">\(\int_C \vec{F} \cdot d\vec{r}\)</span> é <em class="emphasis">independente do caminho</em> quando <span class="process-math">\(\int_{C_1} \vec{F} \cdot d\vec{r} = \int_{C_2} \vec{F} \cdot d\vec{r}\)</span> para quaisquer dois caminhos <span class="process-math">\(C_1\)</span> e <span class="process-math">\(C_2\)</span> que tenham os mesmos pontos inicial e final.</div></article><span class="incontext"><a href="sec-teorema-fundamental.html#def-independencia-caminho" class="internal">em contexto</a></span>
