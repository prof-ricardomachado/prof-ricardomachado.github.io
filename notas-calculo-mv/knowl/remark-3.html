<div class="para logical">
<div class="para">Lembre que o comprimento do vetor <span class="process-math">\(F'(t)\)</span> é:</div>
<div class="displaymath process-math">
\begin{equation*}
||F'(t)|| = \sqrt{(x'(t))^2 + (y'(t))^2 + (z'(t))^2}
\end{equation*}
</div>
<div class="para">Assim, para obter um vetor de norma 1 (vetor unitário), faremos:</div>
<div class="displaymath process-math">
\begin{equation*}
T(t) = \frac{1}{||F'(t)||} \cdot F'(t)
\end{equation*}
</div>
