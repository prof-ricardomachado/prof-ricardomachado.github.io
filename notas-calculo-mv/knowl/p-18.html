<div class="para">Note que o comprimento do vetor <span class="process-math">\(g(t)\)</span> é:</div>
<div class="displaymath process-math">
\begin{align*}
||g(t)|| \amp = \sqrt{(e^{-0,22t}\cos t)^2 + (e^{-0,22t}\text{sen } t)^2}\\
\amp = \sqrt{(e^{-0,22t})^2(\cos^2 t + \text{sen}^2 t)}\\
\amp = \sqrt{(e^{-0,22t})^2} = e^{-0,22t}
\end{align*}
