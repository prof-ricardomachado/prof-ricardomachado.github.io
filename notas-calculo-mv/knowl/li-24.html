</h4>Note que se <span class="process-math">\(C\)</span> é o segmento que une <span class="process-math">\((a,0)\)</span> e <span class="process-math">\((b,0)\text{,}\)</span> então uma parametrização de <span class="process-math">\(C\)</span> é <span class="process-math">\(C(x) = (x,0)\)</span> com <span class="process-math">\(a \le x \le b\text{.}\)</span> Assim:<div class="displaymath process-math">
\begin{equation*}
\int_C f(x,y) \, ds = \int_{a}^{b} f(x,0) ||(1,0)|| \, dx = \int_{a}^{b} f(x,0) \, dx
\end{equation*}
