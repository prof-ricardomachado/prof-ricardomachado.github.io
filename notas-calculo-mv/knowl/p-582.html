<div class="para logical">
<div class="para">Pelo Teorema de Stokes, o fluxo do rotacional sobre a calota esférica <span class="process-math">\(S\)</span> é igual à circulação de <span class="process-math">\(\vec{F}\)</span> ao longo de seu bordo <span class="process-math">\(C = \partial S\text{:}\)</span>
</div>
<div class="displaymath process-math">
\begin{equation*}
\iint_{S} \text{rot}\,\vec{F} \cdot d\vec{S} = \oint_{C} \vec{F} \cdot d\vec{r}
\end{equation*}
