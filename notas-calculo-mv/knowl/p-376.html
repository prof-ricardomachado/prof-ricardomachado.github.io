\oint_{C} (3y - e^{\sin x}) \, dx + (7x + \sqrt{y^4+1}) \, dy \amp = \iint_{D} (7 - 3) \, dA  \\
\amp = 4 \iint_{D} 1 \, dA \\
\amp = 4 A(D)\\
\amp = 4 \cdot \pi(3)^2 \\
\amp = 36\pi
