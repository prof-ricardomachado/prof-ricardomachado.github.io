\frac{\partial \sigma}{\partial u} \times \frac{\partial \sigma}{\partial v} = 
\begin{vmatrix}
\vec{i} &amp; \vec{j} &amp; \vec{k} \\
1 &amp; 0 &amp; -2u \\
0 &amp; 1 &amp; -2v
\end{vmatrix}
= 2u\vec{i} + 2v\vec{j} + \vec{k}
\end{equation*}
