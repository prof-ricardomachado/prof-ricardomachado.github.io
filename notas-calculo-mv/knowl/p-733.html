<div class="para logical">
<div class="para">A integral tripla de 1 sobre <span class="process-math">\(E\)</span> é simplesmente o volume da esfera unitária. Sabendo que o volume de uma esfera de raio <span class="process-math">\(R\)</span> é <span class="process-math">\(\frac{4}{3}\pi R^3\text{,}\)</span> temos:</div>
<div class="displaymath process-math">
\begin{equation*}
\iiint_{E} 1 \, dV = \frac{4}{3}\pi(1)^3 = \frac{4\pi}{3}
\end{equation*}
