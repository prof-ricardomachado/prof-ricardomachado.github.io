<div class="para">Portanto, o número ímpar de visitas nas <span class="process-math">\(n\)</span> exposições está em bijeção com o número qualquer de visitas nas <span class="process-math">\(n-1\)</span> primeiras exposições. Este número é <span class="process-math">\(2^{n-1}\text{.}\)</span> Pois, em cada umas das <span class="process-math">\(n-1\)</span> primeiras exposições, Andrês só precisa descidir se entra ou não.</div>
