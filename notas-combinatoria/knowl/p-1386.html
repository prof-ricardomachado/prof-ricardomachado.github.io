<h5 class="heading"><span class="type">Parágrafo</span></h5>
<div class="para">Qualquer caminho de <span class="process-math">\((0,0)\)</span> até <span class="process-math">\((n,n)\)</span> exige exatamente <span class="process-math">\(2n\)</span> passos (<span class="process-math">\(n\)</span> para a direita e <span class="process-math">\(n\)</span> para cima). O número total de caminhos é a escolha de quais <span class="process-math">\(n\)</span> passos serão para a direita dentre os <span class="process-math">\(2n\)</span> passos totais, ou seja, <span class="process-math">\(C_{2n}^n\text{.}\)</span>
</div>
