<div class="para">A quantidade de presentes dados no <span class="process-math">\(k\)</span>-ésimo dia é a soma de uma progressão aritmética: <span class="process-math">\(1+2+\cdots+k = \frac{k(k+1)}{2}\text{.}\)</span> Note que isso é exatamente a fórmula da combinação <span class="process-math">\(C_{k+1}^2\text{.}\)</span>
