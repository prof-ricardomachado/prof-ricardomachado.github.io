<div class="para logical">
<div class="para">Para cada inteiro não negativo <span class="process-math">\(n\text{,}\)</span> o <dfn class="terminology">polinômio de Laguerre</dfn> de ordem <span class="process-math">\(n\text{,}\)</span> denotado por <span class="process-math">\(L_n(x)\text{,}\)</span> é definido explicitamente pela expressão:</div>
<div class="displaymath process-math">
\begin{equation*}
L_n(x) = \sum_{k=0}^n C_n^k \frac{(-1)^k}{k!} x^k.
\end{equation*}
</div>
