<div class="para">Pelas Relações Complementares (<a href="" class="xref" data-knowl="./knowl/teo-reolacoes-complementares.html" title="Teorema 3.1.9">Teorema 3.1.9</a>), sabemos que <span class="process-math">\(C_n^{n-k} = C_n^k\text{.}\)</span> Substituindo no somatório, obtemos:</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/teo-reolacoes-complementares.html">
\begin{equation*}
\sum_{k=0}^n C_n^k \cdot C_n^k = \sum_{k=0}^n (C_n^k)^2 = C_{2n}^n 
\end{equation*}
</div>
<div class="para">O que conclui a demonstração.</div>
