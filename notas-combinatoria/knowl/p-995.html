<div class="para">A expressão algébrica dentro dos parênteses pode ser reescrita colocando <span class="process-math">\(x^n\)</span> em evidência e invertendo a variável do polinômio de torre:</div>
<div class="displaymath process-math">
\begin{equation*}
\sum_{j=0}^n r_j (-1)^j x^{n-j} = x^n \sum_{j=0}^n r_j (-x^{-1})^j = x^n R(-x^{-1}, T) 
\end{equation*}
