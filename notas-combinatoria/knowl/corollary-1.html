</h3>
<div class="para logical">
<div class="para">Para qualquer inteiro não negativo <span class="process-math">\(n\text{,}\)</span> a soma dos quadrados dos elementos da <span class="process-math">\(n\)</span>-ésima linha do Triângulo de Pascal é dada por:</div>
<div class="displaymath process-math">
\begin{equation*}
(C_n^0)^2 + (C_n^1)^2 + (C_n^2)^2 + \cdots + (C_n^n)^2 = C_{2n}^n 
\end{equation*}
