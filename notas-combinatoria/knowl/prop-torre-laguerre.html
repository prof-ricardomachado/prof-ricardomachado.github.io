<div class="para logical">
<div class="para">Seja <span class="process-math">\(T_n\)</span> um tabuleiro quadrado de ordem <span class="process-math">\(n \times n\)</span> e <span class="process-math">\(R(x, T_n)\)</span> o seu respectivo polinômio de torre. A seguinte identidade é válida:</div>
<div class="displaymath process-math">
\begin{equation*}
x^n R(-x^{-1}, T_n) = n! (-1)^n L_n(x).
\end{equation*}
</div>
