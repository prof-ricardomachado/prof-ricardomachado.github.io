<article class="theorem theorem-like"><h3 class="heading">
<span class="type">Teorema</span><span class="space"> </span><span class="codenumber">3.1.28</span><span class="period">.</span><span class="space"> </span><span class="title">Identidade de Vandermonde.</span>
</h3>
<div class="para logical">
<div class="para">Para quaisquer inteiros não negativos <span class="process-math">\(m\text{,}\)</span> <span class="process-math">\(n\)</span> e <span class="process-math">\(p\)</span> (com <span class="process-math">\(p \leq m+n\)</span>), a seguinte identidade é válida:</div>
<div class="displaymath process-math">
\begin{equation*}
\sum_{k=0}^p C_m^k \cdot C_n^{p-k} = C_{m+n}^p 
\end{equation*}
</div>
