\left(C_n^{n-k}\right)^2 (n-k)! \amp = \left( \frac{n!}{k!(n-k)!} \right)^2 (n-k)! \\
\amp = \frac{(n!)^2}{(k!)^2 (n-k)!} \\
\amp = n! \cdot \left( \frac{n!}{k!(n-k)!} \right) \cdot \frac{1}{k!} \\
\amp = n! \cdot C_n^k \frac{1}{k!}. 
\end{align*}
