<div class="para logical">
<div class="para">Seja <span class="process-math">\(T\)</span> um tabuleiro <span class="process-math">\(n\times n\text{,}\)</span> então, o número de maneiras de colocar <span class="process-math">\(n\)</span> torres não atacantes em <span class="process-math">\(T\)</span> é dado por:</div>
<div class="displaymath process-math">
\begin{equation}
r_n(T) = \sum_{k=0}^n (-1)^k\cdot(n-k)!\cdot r_k(T^c).\tag{2.1}
\end{equation}
