</h4>
<div class="para logical">
<div class="para">O número de permutações 2-discordantes de <span class="process-math">\(n\)</span> elementos distintos é:</div>
<div class="displaymath process-math">
\begin{equation*}
\sum_{k=0}^{n}(-1)^k\cdot(n-k)!\cdot \frac{2n}{2n-k}\binom{2n-k}{k}.
\end{equation*}
</div>
