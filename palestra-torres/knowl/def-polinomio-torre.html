<article class="definition definition-like"><h3 class="heading">
<span class="type">Definição</span><span class="space"> </span><span class="codenumber">2.3</span><span class="period">.</span>
</h3>
<div class="para logical">
<div class="para">Seja <span class="process-math">\(T\)</span> um tabuleiro <span class="process-math">\(m\times n\text{,}\)</span> o <em class="emphasis">polinômio de torre</em> de <span class="process-math">\(T\)</span> é definido como</div>
<div class="displaymath process-math">
\begin{equation*}
R(x, T) = \sum_{k=0}^{\min\{m, n\}} r_k(T)x^k,
\end{equation*}
</div>
<div class="para">no qual, <span class="process-math">\(r_k(T)\)</span> é o número de maneiras de colocar <span class="process-math">\(k\)</span> torres não atacantes em <span class="process-math">\(T\text{.}\)</span>
</div>
</div></article><span class="incontext"><a href="section-2.html#def-polinomio-torre" class="internal">em contexto</a></span>
