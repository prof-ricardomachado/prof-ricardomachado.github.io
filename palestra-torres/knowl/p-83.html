<div class="para logical">
<div class="para">O número de permutações <span class="process-math">\(k\)</span>-posicionadas de <span class="process-math">\(n\)</span> elementos é dado por:</div>
<div class="displaymath process-math">
\begin{equation*}
R_{n,k} = 
\begin{cases}
\displaystyle\sum_{i=0}^{k-1} (-1)^i\cdot(n-1-i)!\cdot \binom{k-1}{i} , \amp\text{se } k\leq n;\\
D_{n}, \amp\text{se } k=n+1.
\end{cases}
\end{equation*}
</div>
