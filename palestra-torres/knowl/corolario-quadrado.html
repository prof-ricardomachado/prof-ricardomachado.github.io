<div class="para logical">
<div class="para">Seja <span class="process-math">\(T\)</span> um tabuleiro <span class="process-math">\(m\times n\text{,}\)</span> sem restrições. O polinômio de torre de <span class="process-math">\(T\)</span> é dado por:</div>

\begin{equation*}
R(x, T) = \sum_{k=0}^{\min\{m,n\}} \binom{m}{k} \cdot \binom{n}{k} \cdot k! \cdot x^k.
\end{equation*}
