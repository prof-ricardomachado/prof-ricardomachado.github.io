<h5 class="heading"><span class="type">Parágrafo</span></h5>
<div class="para">Observe que o MDC de dois números consecutivos é igual a 1: <span class="process-math">\(mdc(a, a+1) = mdc(a, (a+1)-a) = mdc(a, 1) = 1\text{.}\)</span> Dos <span class="process-math">\(2n\)</span> números consecutivos serão selecionados <span class="process-math">\(n+1\text{.}\)</span> Se selecionarmos 2 consecutivos eles serão primos entre si.</div>
