<h5 class="heading"><span class="type">Parágrafo</span></h5>
<div class="para">A distância euclidiana entre esses vértices opostos do losango (a sua diagonal maior) é exatamente <span class="process-math">\(\sqrt{3}\)</span> metros. Isso gera uma nova regra em nosso plano hipotético: qualquer par de pontos distando <span class="process-math">\(\sqrt{3}\)</span> metros deve compartilhar a mesma cor.</div>
