<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="100%" height="100%"><defs><style>.string-line{stroke:#94a3b8;stroke-width:4;stroke-linecap:round;}.b-blue{fill:#38bdf8;stroke:#0284c7;stroke-width:2.5;}.b-yellow{fill:#facc15;stroke:#ca8a04;stroke-width:2.5;}.b-red{fill:#f87171;stroke:#dc2626;stroke-width:2.5;}.txt{font-family:'Arial',sans-serif;font-size:13px;font-weight:bold;fill:#1e293b;text-anchor:middle;}.bracket{stroke:#475569;stroke-width:2;fill:none;}</style></defs><g transform="translate(30, 40)"><line x1="10" y1="40" x2="540" y2="40" class="string-line"/><circle cx="40" cy="40" r="16" class="b-blue"/><text x="40" y="70" class="txt" font-size="11px">1ª</text><circle cx="85" cy="40" r="16" class="b-blue"/><text x="85" y="70" class="txt" font-size="11px">2ª</text><circle cx="130" cy="40" r="16" class="b-yellow"/><text x="130" y="70" class="txt" font-size="11px">3ª</text><circle cx="175" cy="40" r="16" class="b-yellow"/><text x="175" y="70" class="txt" font-size="11px">4ª</text><circle cx="220" cy="40" r="16" class="b-yellow"/><text x="220" y="70" class="txt" font-size="11px">5ª</text><circle cx="265" cy="40" r="16" class="b-red"/><text x="265" y="70" class="txt" font-size="11px">6ª</text><path d="M25,82 L25,95 L152,95 L152,105 L152,95 L280,95 L280,82" class="bracket"/><text x="152" y="125" class="txt" fill="#475569">1 Ciclo = 6 Contas</text><circle cx="320" cy="40" r="16" class="b-blue"/><circle cx="365" cy="40" r="16" class="b-blue"/><circle cx="410" cy="40" r="16" class="b-yellow"/><text x="465" y="45" font-family="Arial" font-size="28px" font-weight="bold" fill="#64748b" text-anchor="middle">. . .</text><circle cx="520" cy="40" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4,3"/><text x="520" y="45" class="txt" fill="#dc2626">75ª?</text></g></svg>
