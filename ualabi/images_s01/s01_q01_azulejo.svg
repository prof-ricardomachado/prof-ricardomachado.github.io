<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%" height="100%"><defs><style>.tile-border{fill:#f8fafc;stroke:#1e293b;stroke-width:3;}.stripe{fill:#334155;}.diag-cut{stroke:#dc2626;stroke-width:3;stroke-dasharray:5,4;}.qmark{font-family:'Arial',sans-serif;font-size:38px;font-weight:bold;fill:#94a3b8;text-anchor:middle;dominant-baseline:central;}.opt-lbl{font-family:'Arial',sans-serif;font-size:14px;font-weight:bold;fill:#1e293b;text-anchor:middle;}.divider{stroke:#cbd5e1;stroke-width:2;}</style></defs><g transform="translate(30, 30)"><rect x="0" y="0" width="180" height="180" class="tile-border"/><polygon points="0,0 0,180 180,180" fill="#f1f5f9"/><polygon points="0,45 0,90 90,180 45,180" class="stripe"/><polygon points="0,135 0,180 180,180 135,180" class="stripe"/><line x1="0" y1="0" x2="180" y2="180" class="diag-cut"/><text x="115" y="65" class="qmark">?</text></g><line x1="250" y1="20" x2="250" y2="230" class="divider"/><g transform="translate(280, 40)"><g transform="translate(0, 0)"><polygon points="0,0 60,0 60,60" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/><rect x="0" y="15" width="60" height="15" class="stripe"/><text x="30" y="85" class="opt-lbl">(A)</text></g><g transform="translate(80, 0)"><polygon points="0,0 60,0 60,60" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/><polygon points="15,0 30,0 60,30 60,15" class="stripe"/><polygon points="45,0 60,0 60,60 60,45" class="stripe"/><text x="30" y="85" class="opt-lbl" fill="#16a34a">(B)</text></g><g transform="translate(160, 0)"><polygon points="0,60 60,60 60,0" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/><polygon points="15,60 30,60 60,30 60,45" class="stripe"/><text x="30" y="85" class="opt-lbl">(C)</text></g><g transform="translate(240, 0)"><polygon points="0,0 60,0 60,60" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/><polygon points="0,0 60,0 60,25" class="stripe"/><text x="30" y="85" class="opt-lbl">(D)</text></g><g transform="translate(120, 110)"><polygon points="0,0 60,0 60,60" fill="#334155" stroke="#1e293b" stroke-width="2"/><polygon points="15,0 30,0 60,30 60,15" fill="#f8fafc"/><text x="30" y="85" class="opt-lbl">(E)</text></g></g></svg>
