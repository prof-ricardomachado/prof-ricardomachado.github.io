<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%"><defs><style>.booth{fill:#fef08a;stroke:#ca8a04;stroke-width:3;rx:6;}.pos-box{fill:#f8fafc;stroke:#334155;stroke-width:2.5;rx:8;}.lbl-booth{font-family:'Arial',sans-serif;font-size:13px;font-weight:bold;fill:#854d0e;text-anchor:middle;dominant-baseline:central;}.lbl-num{font-family:'Arial',sans-serif;font-size:20px;font-weight:bold;fill:#1e293b;text-anchor:middle;dominant-baseline:central;}.arr-dir{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arr-blue);}</style><marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#2563eb"/></marker></defs><g transform="translate(20, 35)"><rect x="0" y="0" width="85" height="90" class="booth"/><text x="42" y="35" class="lbl-booth">BILHETEIRA</text><rect x="20" y="60" width="45" height="20" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/><text x="42" y="70" class="lbl-booth" font-size="11px">Guiché</text></g><line x1="430" y1="20" x2="130" y2="20" class="arr-dir"/><text x="280" y="12" font-family="Arial" font-size="12px" font-weight="bold" fill="#2563eb" text-anchor="middle">Sentido de Atendimento</text><g transform="translate(130, 45)"><rect x="0" y="0" width="65" height="70" class="pos-box"/><text x="32" y="35" class="lbl-num">1ª</text><rect x="90" y="0" width="65" height="70" class="pos-box" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="122" y="35" class="lbl-num" fill="#0369a1">2ª</text><rect x="180" y="0" width="65" height="70" class="pos-box"/><text x="212" y="35" class="lbl-num">3ª</text><rect x="270" y="0" width="65" height="70" class="pos-box"/><text x="302" y="35" class="lbl-num">4ª</text></g></svg>
