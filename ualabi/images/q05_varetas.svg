<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <style>
      .bar-line { stroke-width: 14; stroke-linecap: round; }
      .lbl { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; }
      .axis { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,4; }
    </style>
  </defs>
  <g transform="translate(40, 20)">
    <line x1="30" y1="10" x2="30" y2="200" class="axis"/>
    <!-- A -->
    <text x="0" y="40" class="lbl">A</text>
    <line x1="30" y1="35" x2="230" y2="35" class="bar-line" stroke="#10b981"/>
    <!-- B -->
    <text x="0" y="80" class="lbl">B</text>
    <line x1="30" y1="75" x2="130" y2="75" class="bar-line" stroke="#3b82f6"/>
    <!-- C -->
    <text x="0" y="120" class="lbl">C</text>
    <line x1="30" y1="115" x2="230" y2="115" class="bar-line" stroke="#ef4444"/>
    <!-- D -->
    <text x="0" y="160" class="lbl">D</text>
    <line x1="30" y1="155" x2="320" y2="155" class="bar-line" stroke="#a855f7"/>
    <!-- E -->
    <text x="0" y="200" class="lbl">E</text>
    <line x1="30" y1="195" x2="420" y2="195" class="bar-line" stroke="#eab308"/>
  </g>
</svg>