<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="100%">
  <defs>
    <style>
      .face-front { fill: #f8fafc; stroke: #1e293b; stroke-width: 2.5; }
      .face-top { fill: #cbd5e1; stroke: #1e293b; stroke-width: 2.5; }
      .face-side { fill: #94a3b8; stroke: #1e293b; stroke-width: 2.5; }
      .symbol { fill: #0f172a; stroke: none; }
      .arrow { stroke: #ef4444; stroke-width: 4; fill: none; marker-end: url(#ah-red); }
      .lbl { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    </style>
    <marker id="ah-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  <g transform="translate(50, 40)">
    <!-- Três cubos em fila -->
    <!-- Cubo 1 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="30" width="60" height="60" class="face-front"/>
      <circle cx="30" cy="60" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <polygon points="0,30 30,0 90,0 60,30" class="face-top"/>
    </g>
    <!-- Cubo 2 -->
    <g transform="translate(60, 30)">
      <rect x="0" y="30" width="60" height="60" class="face-front"/>
      <circle cx="30" cy="60" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <polygon points="0,30 30,0 90,0 60,30" class="face-top"/>
    </g>
    <!-- Cubo 3 -->
    <g transform="translate(120, 30)">
      <rect x="0" y="30" width="60" height="60" class="face-front"/>
      <circle cx="30" cy="60" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <polygon points="0,30 30,0 90,0 60,30" class="face-top"/>
      <polygon points="60,30 90,0 90,60 60,90" class="face-side"/>
    </g>
    <!-- Seta do observador olhando as costas -->
    <line x1="280" y1="30" x2="220" y2="50" class="arrow"/>
    <text x="290" y="35" class="lbl" fill="#ef4444">Visão Oposta</text>
  </g>
</svg>