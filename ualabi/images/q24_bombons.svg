<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <defs>
    <style>
      .box-lid { fill: #fef3c7; stroke: #d97706; stroke-width: 4; rx: 8; }
      .grid-cell { fill: #ffffff; stroke: #b45309; stroke-width: 2.5; }
      .num { font-family: 'Arial', sans-serif; font-size: 32px; font-weight: bold; fill: #78350f; text-anchor: middle; dominant-baseline: central; }
      .title { font-family: 'Arial', sans-serif; font-size: 15px; font-weight: bold; fill: #92400e; text-anchor: middle; }
    </style>
  </defs>
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="280" height="290" class="box-lid"/>
    <text x="140" y="30" class="title">Tampa da Caixa de Doces</text>
    <!-- Grade 3x3 -->
    <g transform="translate(25, 45)">
      <!-- Linha 1: 2, 4, 3 -->
      <rect x="0" y="0" width="75" height="75" class="grid-cell"/><text x="37.5" y="37.5" class="num">2</text>
      <rect x="75" y="0" width="75" height="75" class="grid-cell"/><text x="112.5" y="37.5" class="num">4</text>
      <rect x="150" y="0" width="75" height="75" class="grid-cell"/><text x="187.5" y="37.5" class="num">3</text>
      <!-- Linha 2: 7, 7, 3 -->
      <rect x="0" y="75" width="75" height="75" class="grid-cell"/><text x="37.5" y="112.5" class="num">7</text>
      <rect x="75" y="75" width="75" height="75" class="grid-cell"/><text x="112.5" y="112.5" class="num">7</text>
      <rect x="150" y="75" width="75" height="75" class="grid-cell"/><text x="187.5" y="112.5" class="num">3</text>
      <!-- Linha 3: 4, 6, 5 -->
      <rect x="0" y="150" width="75" height="75" class="grid-cell"/><text x="37.5" y="187.5" class="num">4</text>
      <rect x="75" y="150" width="75" height="75" class="grid-cell"/><text x="112.5" y="187.5" class="num">6</text>
      <rect x="150" y="150" width="75" height="75" class="grid-cell"/><text x="187.5" y="187.5" class="num">5</text>
    </g>
  </g>
</svg>