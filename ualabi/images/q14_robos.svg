<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <style>
      .card { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; rx: 8; }
      .name { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .desc { font-family: 'Arial', sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; }
      .eye { fill: #38bdf8; stroke: #0284c7; stroke-width: 2; }
      .wheel { fill: #475569; stroke: #1e293b; stroke-width: 2; }
    </style>
  </defs>
  <!-- Robô Sonda -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="210" height="170" class="card"/>
    <text x="105" y="30" class="name">Robô Sonda</text>
    <!-- Corpo -->
    <rect x="65" y="50" width="80" height="50" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <!-- 1 Câmera -->
    <circle cx="105" cy="75" r="14" class="eye"/>
    <!-- 4 Rodas -->
    <circle cx="60" cy="115" r="10" class="wheel"/><circle cx="85" cy="115" r="10" class="wheel"/>
    <circle cx="125" cy="115" r="10" class="wheel"/><circle cx="150" cy="115" r="10" class="wheel"/>
    <text x="105" y="150" class="desc">1 Câmera e 4 Rodas</text>
  </g>
  <!-- Robô Escavador -->
  <g transform="translate(280, 20)">
    <rect x="0" y="0" width="210" height="170" class="card"/>
    <text x="105" y="30" class="name">Robô Escavador</text>
    <!-- Corpo -->
    <rect x="65" y="50" width="80" height="50" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <!-- 3 Câmeras -->
    <circle cx="80" cy="75" r="8" class="eye"/><circle cx="105" cy="75" r="8" class="eye"/><circle cx="130" cy="75" r="8" class="eye"/>
    <!-- 2 Rodas -->
    <circle cx="75" cy="115" r="14" class="wheel"/><circle cx="135" cy="115" r="14" class="wheel"/>
    <text x="105" y="150" class="desc">3 Câmeras e 2 Rodas</text>
  </g>
</svg>