<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <style>
      .grid-bg { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 2,2; }
      .track { fill: #334155; stroke: #0f172a; stroke-width: 2; }
      .gap { fill: #fef08a; stroke: #ca8a04; stroke-width: 2; stroke-dasharray: 4,4; }
      .opt-shape { fill: #38bdf8; stroke: #0284c7; stroke-width: 2; }
      .txt { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>
  <!-- Grade principal -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="180" height="180" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <!-- Linhas -->
    <line x1="60" y1="0" x2="60" y2="180" class="grid-bg"/><line x1="120" y1="0" x2="120" y2="180" class="grid-bg"/>
    <line x1="0" y1="60" x2="180" y2="60" class="grid-bg"/><line x1="0" y1="120" x2="180" y2="120" class="grid-bg"/>
    <!-- Trilho 1 -->
    <rect x="0" y="0" width="60" height="60" class="track"/>
    <!-- Trilho 2 -->
    <rect x="120" y="120" width="60" height="60" class="track"/>
    <!-- Vão que precisa da peça de conexão (L-tromino) -->
    <polygon points="60,0 120,0 120,120 60,120 60,60" class="gap"/>
  </g>
  <!-- Divisor -->
  <line x1="240" y1="10" x2="240" y2="210" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Opções -->
  <g transform="translate(260, 30)">
    <!-- (A) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="10" width="40" height="40" class="opt-shape"/>
      <text x="20" y="70" class="txt">(A)</text>
    </g>
    <!-- (B) Correta: Trominó em L -->
    <g transform="translate(60, 0)">
      <polygon points="0,0 40,0 40,20 20,20 20,40 0,40" class="opt-shape" fill="#10b981" stroke="#047857"/>
      <text x="20" y="70" class="txt">(B)</text>
    </g>
    <!-- (C) -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="20" height="50" class="opt-shape"/>
      <text x="10" y="70" class="txt">(C)</text>
    </g>
    <!-- (D) -->
    <g transform="translate(180, 0)">
      <polygon points="0,0 40,0 40,40 20,40 20,20 0,20" class="opt-shape"/>
      <text x="20" y="70" class="txt">(D)</text>
    </g>
    <!-- (E) -->
    <g transform="translate(230, 0)">
      <rect x="0" y="10" width="45" height="15" class="opt-shape"/>
      <text x="22" y="70" class="txt">(E)</text>
    </g>
  </g>
</svg>