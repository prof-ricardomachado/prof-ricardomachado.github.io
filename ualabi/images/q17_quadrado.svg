<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <style>
      .cell { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .target { fill: #fed7aa; stroke: #ea580c; stroke-width: 3.5; }
      .num { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .qmark { font-family: 'Arial', sans-serif; font-size: 28px; font-weight: bold; fill: #dc2626; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <g transform="translate(30, 30)">
    <!-- Linha 1: [2, 0, ?, .] -->
    <rect x="0" y="0" width="65" height="65" class="cell"/><text x="32.5" y="32.5" class="num">2</text>
    <rect x="65" y="0" width="65" height="65" class="cell"/><text x="97.5" y="32.5" class="num">0</text>
    <rect x="130" y="0" width="65" height="65" class="target"/><text x="162.5" y="32.5" class="qmark">?</text>
    <rect x="195" y="0" width="65" height="65" class="cell"/>

    <!-- Linha 2: [., 2, ., .] -->
    <rect x="0" y="65" width="65" height="65" class="cell"/>
    <rect x="65" y="65" width="65" height="65" class="cell"/><text x="97.5" y="97.5" class="num">2</text>
    <rect x="130" y="65" width="65" height="65" class="cell"/>
    <rect x="195" y="65" width="65" height="65" class="cell"/>

    <!-- Linha 3: [., ?, 6, .] -->
    <rect x="0" y="130" width="65" height="65" class="cell"/>
    <rect x="65" y="130" width="65" height="65" class="target"/><text x="97.5" y="162.5" class="qmark">?</text>
    <rect x="130" y="130" width="65" height="65" class="cell"/><text x="162.5" y="162.5" class="num">6</text>
    <rect x="195" y="130" width="65" height="65" class="cell"/>

    <!-- Linha 4 -->
    <rect x="0" y="195" width="65" height="65" class="cell"/>
    <rect x="65" y="195" width="65" height="65" class="cell"/>
    <rect x="130" y="195" width="65" height="65" class="cell"/>
    <rect x="195" y="195" width="65" height="65" class="cell"/>
  </g>
</svg>