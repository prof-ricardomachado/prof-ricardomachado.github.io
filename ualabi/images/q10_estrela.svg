<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="100%" height="100%">
  <defs>
    <style>
      .poly-bg { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
      .grid-unit { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; }
      .p1 { fill: #38bdf8; stroke: #0284c7; stroke-width: 2; }
      .p2 { fill: #f472b6; stroke: #db2777; stroke-width: 2; }
      .p3 { fill: #4ade80; stroke: #16a34a; stroke-width: 2; }
      .p4 { fill: #fb923c; stroke: #ea580c; stroke-width: 2; }
      .p5 { fill: #c084fc; stroke: #9333ea; stroke-width: 2; }
      .lbl { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>
  <!-- Figura alvo (15 unidades) -->
  <g transform="translate(20, 20)">
    <text x="80" y="15" class="lbl">Figura Alvo (Área = 15)</text>
    <g transform="translate(10, 30)">
      <!-- Formato de cruz/losango escalonado -->
      <rect x="40" y="0" width="60" height="20" class="grid-unit"/>
      <rect x="20" y="20" width="100" height="20" class="grid-unit"/>
      <rect x="0" y="40" width="140" height="20" class="grid-unit"/>
      <rect x="20" y="60" width="100" height="20" class="grid-unit"/>
      <rect x="40" y="80" width="60" height="20" class="grid-unit"/>
    </g>
  </g>
  <!-- Divisor -->
  <line x1="200" y1="15" x2="200" y2="200" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Peças disponíveis -->
  <g transform="translate(220, 20)">
    <text x="160" y="15" class="lbl">5 Peças Disponíveis</text>
    <!-- Peça 1: trominó 3 -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="45" height="15" class="p1"/>
      <text x="22" y="35" class="lbl">1 (Área 3)</text>
    </g>
    <!-- Peça 2: tetraminó 4 -->
    <g transform="translate(80, 40)">
      <polygon points="0,0 30,0 30,15 45,15 45,30 15,30 15,15 0,15" class="p2"/>
      <text x="22" y="45" class="lbl">2 (Área 4)</text>
    </g>
    <!-- Peça 3: tetraminó 4 -->
    <g transform="translate(160, 40)">
      <polygon points="0,0 45,0 45,15 15,15 15,30 0,30" class="p3"/>
      <text x="22" y="45" class="lbl">3 (Área 4)</text>
    </g>
    <!-- Peça 4: pentaminó 5 -->
    <g transform="translate(240, 40)">
      <polygon points="0,0 45,0 45,15 30,15 30,30 15,30 15,45 0,45" class="p4"/>
      <text x="22" y="60" class="lbl">4 (Área 5)</text>
    </g>
    <!-- Peça 5: trominó 3 -->
    <g transform="translate(80, 120)">
      <polygon points="0,0 30,0 30,15 15,15 15,30 0,30" class="p5"/>
      <text x="15" y="45" class="lbl">5 (Área 3)</text>
    </g>
  </g>
</svg>