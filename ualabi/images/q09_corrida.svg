<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" width="100%" height="100%">
  <defs>
    <style>
      .photo-frame { fill: #f8fafc; stroke: #334155; stroke-width: 3; rx: 6; }
      .finish-line { stroke: #dc2626; stroke-width: 3; stroke-dasharray: 5,3; }
      .title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .name-tag { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <!-- Foto 1 -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="190" height="170" class="photo-frame"/>
    <text x="95" y="25" class="title">Foto 1</text>
    <line x1="120" y1="35" x2="120" y2="160" class="finish-line"/>
    <!-- Beto após linha -->
    <rect x="135" y="70" width="45" height="24" rx="4" fill="#2563eb"/>
    <text x="157" y="82" class="name-tag">Beto</text>
    <!-- Caio antes da linha -->
    <rect x="50" y="100" width="45" height="24" rx="4" fill="#059669"/>
    <text x="72" y="112" class="name-tag">Caio</text>
  </g>
  <!-- Foto 2 -->
  <g transform="translate(235, 20)">
    <rect x="0" y="0" width="190" height="170" class="photo-frame"/>
    <text x="95" y="25" class="title">Foto 2</text>
    <line x1="120" y1="35" x2="120" y2="160" class="finish-line"/>
    <!-- Caio após linha -->
    <rect x="130" y="60" width="45" height="24" rx="4" fill="#059669"/>
    <text x="152" y="72" class="name-tag">Caio</text>
    <!-- Dani cruzando -->
    <rect x="95" y="100" width="45" height="24" rx="4" fill="#d97706"/>
    <text x="117" y="112" class="name-tag">Dani</text>
  </g>
  <!-- Foto 3 -->
  <g transform="translate(450, 20)">
    <rect x="0" y="0" width="190" height="170" class="photo-frame"/>
    <text x="95" y="25" class="title">Foto 3</text>
    <line x1="120" y1="35" x2="120" y2="160" class="finish-line"/>
    <!-- Dani após linha -->
    <rect x="135" y="70" width="45" height="24" rx="4" fill="#d97706"/>
    <text x="157" y="82" class="name-tag">Dani</text>
    <!-- Edu cruzando -->
    <rect x="95" y="105" width="45" height="24" rx="4" fill="#7c3aed"/>
    <text x="117" y="117" class="name-tag">Edu</text>
  </g>
</svg>