<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%">
  <defs>
    <style>
      .front-grid { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .dark-cell { fill: #64748b; stroke: #334155; stroke-width: 2.5; }
      .light-cell { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .arrow { stroke: #ef4444; stroke-width: 4; fill: none; marker-end: url(#ah-red-22); }
      .lbl { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    </style>
    <marker id="ah-red-22" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  <g transform="translate(60, 40)">
    <!-- Face observada (3x3): 7 escuras, 2 claras -->
    <!-- Linha 1 -->
    <rect x="0" y="0" width="45" height="45" class="dark-cell"/>
    <rect x="45" y="0" width="45" height="45" class="dark-cell"/>
    <rect x="90" y="0" width="45" height="45" class="dark-cell"/>
    <!-- Linha 2 -->
    <rect x="0" y="45" width="45" height="45" class="dark-cell"/>
    <rect x="45" y="45" width="45" height="45" class="light-cell"/>
    <rect x="90" y="45" width="45" height="45" class="dark-cell"/>
    <!-- Linha 3 -->
    <rect x="0" y="90" width="45" height="45" class="dark-cell"/>
    <rect x="45" y="90" width="45" height="45" class="light-cell"/>
    <rect x="90" y="90" width="45" height="45" class="dark-cell"/>

    <!-- Projeção isométrica superior/lateral simples -->
    <polygon points="0,0 35,-25 170,-25 135,0" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    <polygon points="135,0 170,-25 170,110 135,135" fill="#94a3b8" stroke="#334155" stroke-width="2"/>

    <!-- Seta do observador -->
    <line x1="-40" y1="67" x2="-10" y2="67" class="arrow"/>
    <text x="-65" y="72" class="lbl" fill="#ef4444">Visão</text>
  </g>
</svg>