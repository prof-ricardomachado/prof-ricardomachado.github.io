<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <style>
      .cell { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .header-txt { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .arr { stroke: #dc2626; stroke-width: 4; stroke-linecap: round; marker-end: url(#arr-red); fill: none; }
    </style>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Colunas A, B, C, D -->
  <text x="95" y="25" class="header-txt">A</text><text x="165" y="25" class="header-txt">B</text>
  <text x="235" y="25" class="header-txt">C</text><text x="305" y="25" class="header-txt">D</text>
  <!-- Linhas 1, 2, 3 -->
  <text x="35" y="85" class="header-txt">1</text><text x="35" y="155" class="header-txt">2</text><text x="35" y="225" class="header-txt">3</text>

  <g transform="translate(60, 50)">
    <!-- Grade 3x4 (células 70x70) -->
    <!-- Linha 1 -->
    <rect x="0" y="0" width="70" height="70" class="cell"/><line x1="15" y1="35" x2="55" y2="35" class="arr"/><!-- A1 -> Dir -->
    <rect x="70" y="0" width="70" height="70" class="cell"/><line x1="105" y1="15" x2="105" y2="55" class="arr"/><!-- B1 -> Baixo -->
    <rect x="140" y="0" width="70" height="70" class="cell"/><line x1="155" y1="35" x2="195" y2="35" class="arr"/><!-- C1 -> Dir -->
    <rect x="210" y="0" width="70" height="70" class="cell"/><line x1="245" y1="15" x2="245" y2="55" class="arr"/><!-- D1 -> Baixo -->

    <!-- Linha 2 -->
    <rect x="0" y="70" width="70" height="70" class="cell"/><line x1="35" y1="125" x2="35" y2="85" class="arr"/><!-- A2 -> Cima -->
    <rect x="70" y="70" width="70" height="70" class="cell"/><line x1="85" y1="105" x2="125" y2="105" class="arr"/><!-- B2 -> Dir -->
    <rect x="140" y="70" width="70" height="70" class="cell"/><line x1="175" y1="125" x2="175" y2="85" class="arr"/><!-- C2 -> Cima -->
    <rect x="210" y="70" width="70" height="70" class="cell"/><line x1="245" y1="85" x2="245" y2="125" class="arr"/><!-- D2 -> Baixo -->

    <!-- Linha 3 -->
    <rect x="0" y="140" width="70" height="70" class="cell"/><line x1="35" y1="195" x2="35" y2="155" class="arr"/><!-- A3 -> Cima -->
    <rect x="70" y="140" width="70" height="70" class="cell"/><line x1="125" y1="175" x2="85" y2="175" class="arr"/><!-- B3 -> Esq -->
    <rect x="140" y="140" width="70" height="70" class="cell"/><line x1="195" y1="175" x2="155" y2="175" class="arr"/><!-- C3 -> Esq -->
    <rect x="210" y="140" width="70" height="70" class="cell"/><line x1="265" y1="175" x2="225" y2="175" class="arr"/><!-- D3 -> Esq -->
  </g>
</svg>