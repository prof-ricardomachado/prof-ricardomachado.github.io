<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <defs>
    <style>
      .rod-1 { stroke: #10b981; stroke-width: 14; stroke-linecap: round; }
      .rod-2 { stroke: #3b82f6; stroke-width: 14; stroke-linecap: round; }
      .rod-3 { stroke: #ef4444; stroke-width: 14; stroke-linecap: round; }
      .lbl { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>
  <!-- Varetas padrão -->
  <g transform="translate(40, 25)">
    <line x1="20" y1="20" x2="60" y2="20" class="rod-1"/><text x="40" y="50" class="lbl">1 cm</text>
    <line x1="120" y1="20" x2="200" y2="20" class="rod-2"/><text x="160" y="50" class="lbl">2 cm</text>
    <line x1="260" y1="20" x2="380" y2="20" class="rod-3"/><text x="320" y="50" class="lbl">3 cm</text>
  </g>
  <!-- Linha de 50 cm montada -->
  <g transform="translate(40, 110)">
    <text x="0" y="15" class="lbl" text-anchor="start">Início:</text>
    <line x1="55" y1="10" x2="115" y2="10" class="rod-2"/>
    <line x1="125" y1="10" x2="155" y2="10" class="rod-1"/>
    <line x1="165" y1="10" x2="225" y2="10" class="rod-2"/>
    <line x1="235" y1="10" x2="325" y2="10" class="rod-3"/>
    <text x="345" y="15" class="lbl" text-anchor="start">. . . . . . (Total: 50 cm)</text>
    <line x1="480" y1="10" x2="540" y2="10" class="rod-2"/>
    <text x="510" y="35" class="lbl">Fim</text>
  </g>
</svg>