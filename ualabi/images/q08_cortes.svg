<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="100%" height="100%">
  <defs>
    <style>
      .sq-white { fill: #ffffff; stroke: #0f172a; stroke-width: 3; }
      .sq-gray { fill: #94a3b8; stroke: #0f172a; stroke-width: 3; }
      .sq-black { fill: #1e293b; stroke: #0f172a; stroke-width: 3; }
      .cut-line { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 6,4; }
      .scis { font-size: 20px; text-anchor: middle; dominant-baseline: central; fill: #ef4444; }
    </style>
  </defs>
  <g transform="translate(60, 40)">
    <!-- Quadrado Branco Grande 240x240 -->
    <rect x="0" y="0" width="240" height="240" class="sq-white"/>
    <!-- Quadrado Cinza Médio 160x160 no canto sup-dir -->
    <rect x="80" y="0" width="160" height="160" class="sq-gray"/>
    <!-- Quadrado Preto Pequeno 80x80 no canto sup-dir -->
    <rect x="160" y="0" width="80" height="80" class="sq-black"/>

    <!-- Linha de corte Vertical: x = 200 (passa pelo meio do preto) -->
    <line x1="200" y1="-25" x2="200" y2="265" class="cut-line"/>
    <text x="200" y="-32" class="scis">✂</text>

    <!-- Linha de corte Horizontal: y = 40 (passa pelo meio do preto) -->
    <line x1="-25" y1="40" x2="265" y2="40" class="cut-line"/>
    <text x="278" y="40" class="scis">✂</text>
  </g>
</svg>