<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <defs>
    <style>
      .ring { fill: none; stroke: #94a3b8; stroke-width: 4; stroke-dasharray: 6,4; }
      .child { fill: #f8fafc; stroke: #1e293b; stroke-width: 3; }
      .txt { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .hand-txt { font-family: 'Arial', sans-serif; font-size: 11px; font-weight: bold; fill: #dc2626; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <g transform="translate(170, 170)">
    <circle cx="0" cy="0" r="100" class="ring"/>
    <!-- 5 Crianças: Ana (Topo, -90°), Bia (-18°), Cris (+54°), Eva (+126°), Duda (+198°) -->
    <!-- Bia no topo -->
    <g transform="translate(0, -100)">
      <circle cx="0" cy="0" r="26" class="child" fill="#fecdd3" stroke="#e11d48"/>
      <text x="0" y="0" class="txt">Bia</text>
      <text x="-32" y="10" class="hand-txt">E</text><text x="32" y="10" class="hand-txt">D</text>
    </g>
    <!-- Ana (esquerda de Bia no círculo) -->
    <g transform="translate(-95, -31)">
      <circle cx="0" cy="0" r="26" class="child" fill="#e0e7ff" stroke="#4338ca"/>
      <text x="0" y="0" class="txt">Ana</text>
    </g>
    <!-- Duda -->
    <g transform="translate(-59, 81)">
      <circle cx="0" cy="0" r="26" class="child" fill="#fef08a" stroke="#ca8a04"/>
      <text x="0" y="0" class="txt">Duda</text>
    </g>
    <!-- Eva -->
    <g transform="translate(59, 81)">
      <circle cx="0" cy="0" r="26" class="child" fill="#bbf7d0" stroke="#16a34a"/>
      <text x="0" y="0" class="txt">Eva</text>
    </g>
    <!-- Cris -->
    <g transform="translate(95, -31)">
      <circle cx="0" cy="0" r="26" class="child" fill="#fed7aa" stroke="#ea580c"/>
      <text x="0" y="0" class="txt">Cris</text>
    </g>
  </g>
</svg>