<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" width="100%" height="100%">
  <defs>
    <style>
      .card { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; rx: 4; }
      .char-txt { font-family: 'Arial', sans-serif; font-size: 46px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .wood-bar { fill: #b45309; stroke: #78350f; stroke-width: 3; rx: 4; }
      .wood-lbl { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #fef3c7; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <g transform="translate(30, 30)">
    <!-- Fichas da equação: 9 + 7 = 16 -->
    <!-- Ficha 1: 9 -->
    <rect x="0" y="0" width="60" height="90" class="card"/><text x="30" y="55" class="char-txt">9</text>
    <!-- Sinal + -->
    <rect x="75" y="0" width="60" height="90" class="card"/><text x="105" y="52" class="char-txt">+</text>
    <!-- Ficha 2: 7 -->
    <rect x="150" y="0" width="60" height="90" class="card"/><text x="180" y="55" class="char-txt">7</text>
    <!-- Sinal = -->
    <rect x="225" y="0" width="60" height="90" class="card"/><text x="255" y="50" class="char-txt">=</text>
    <!-- Ficha 3: 1 -->
    <rect x="300" y="0" width="45" height="90" class="card"/><text x="322.5" y="55" class="char-txt">1</text>
    <!-- Ficha 4: 6 -->
    <rect x="355" y="0" width="55" height="90" class="card"/><text x="382.5" y="55" class="char-txt">6</text>

    <!-- Barra de madeira cobrindo a metade superior (de y=0 até y=45) -->
    <rect x="-10" y="-5" width="430" height="50" class="wood-bar"/>
    <text x="205" y="20" class="wood-lbl">RÉGUA DE COBERTURA</text>
  </g>
</svg>