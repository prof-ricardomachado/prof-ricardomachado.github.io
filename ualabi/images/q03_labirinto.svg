<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <defs>
    <style>
      .maze-wall { stroke: #0f172a; stroke-width: 4; stroke-linecap: square; }
      .room-alfa { fill: #e0e7ff; stroke: #4338ca; stroke-width: 3; }
      .room-omega { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .txt { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .door-txt { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #dc2626; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <!-- Borda externa -->
  <rect x="20" y="20" width="300" height="300" fill="none" class="maze-wall"/>
  <!-- Salão Alfa (canto superior esquerdo) -->
  <rect x="50" y="50" width="60" height="60" class="room-alfa"/>
  <text x="80" y="80" class="txt" fill="#312e81">ALFA</text>
  <!-- Portas Alfa -->
  <text x="80" y="38" class="door-txt">N</text>
  <text x="122" y="80" class="door-txt">L</text>
  <text x="80" y="122" class="door-txt">S</text>
  <text x="38" y="80" class="door-txt">O</text>
  <!-- Salão Ômega (canto inferior direito) -->
  <rect x="230" y="230" width="60" height="60" class="room-omega"/>
  <text x="260" y="260" class="txt" fill="#92400e">ÔMEGA</text>
  <!-- Portas Ômega -->
  <text x="260" y="218" class="door-txt">1</text>
  <text x="218" y="260" class="door-txt">2</text>
  <text x="260" y="302" class="door-txt">3</text>
  <text x="302" y="260" class="door-txt">4</text>
  <!-- Paredes internas do labirinto -->
  <line x1="150" y1="20" x2="150" y2="100" class="maze-wall"/>
  <line x1="150" y1="100" x2="280" y2="100" class="maze-wall"/>
  <line x1="20" y1="150" x2="100" y2="150" class="maze-wall"/>
  <line x1="150" y1="150" x2="150" y2="280" class="maze-wall"/>
  <line x1="150" y1="180" x2="280" y2="180" class="maze-wall"/>
  <line x1="100" y1="180" x2="100" y2="280" class="maze-wall"/>
  <line x1="100" y1="280" x2="200" y2="280" class="maze-wall"/>
  <line x1="200" y1="180" x2="200" y2="240" class="maze-wall"/>
</svg>