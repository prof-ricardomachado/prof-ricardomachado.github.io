<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <style>
      .cell { fill: #f8fafc; stroke: #334155; stroke-width: 3; }
      .target { fill: #fef08a; stroke: #ca8a04; stroke-width: 4; }
      .txt-flower { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .qmark { font-family: 'Arial', sans-serif; font-size: 32px; font-weight: bold; fill: #dc2626; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <g transform="translate(25, 25)">
    <!-- Linha 1 -->
    <rect x="0" y="0" width="90" height="90" class="cell"/>
    <text x="45" y="45" class="txt-flower" fill="#e11d48">🌹</text>
    <rect x="90" y="0" width="90" height="90" class="cell"/>
    <text x="135" y="45" class="txt-flower" fill="#7c3aed">🌷</text>
    <rect x="180" y="0" width="90" height="90" class="cell"/>

    <!-- Linha 2 -->
    <rect x="0" y="90" width="90" height="90" class="cell"/>
    <text x="45" y="135" class="txt-flower" fill="#eab308">🌻</text>
    <rect x="90" y="90" width="90" height="90" class="cell"/>
    <rect x="180" y="90" width="90" height="90" class="cell"/>

    <!-- Linha 3 -->
    <rect x="0" y="180" width="90" height="90" class="cell"/>
    <rect x="90" y="180" width="90" height="90" class="target"/>
    <text x="135" y="225" class="qmark">?</text>
    <rect x="180" y="180" width="90" height="90" class="target"/>
    <text x="225" y="225" class="qmark">?</text>
  </g>
</svg>