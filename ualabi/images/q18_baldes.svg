<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="100%" height="100%">
  <defs>
    <style>
      .bucket { fill: #e0f2fe; stroke: #0369a1; stroke-width: 3; }
      .fish { fill: #0284c7; }
      .lbl { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .count-txt { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #0369a1; text-anchor: middle; }
    </style>
    <g id="fish-icon">
      <ellipse cx="0" cy="0" rx="9" ry="5" class="fish"/>
      <polygon points="8,0 14,-5 14,5" class="fish"/>
      <circle cx="-5" cy="-2" r="1" fill="#ffffff"/>
    </g>
  </defs>
  <!-- Balde A (2 peixes) -->
  <g transform="translate(30, 30)">
    <polygon points="10,20 80,20 70,110 20,110" class="bucket"/>
    <use href="#fish-icon" x="45" y="60"/>
    <use href="#fish-icon" x="45" y="85"/>
    <text x="45" y="140" class="lbl">A</text>
    <text x="45" y="160" class="count-txt">(2)</text>
  </g>
  <!-- Balde B (4 peixes) -->
  <g transform="translate(150, 30)">
    <polygon points="10,20 80,20 70,110 20,110" class="bucket"/>
    <use href="#fish-icon" x="35" y="50"/><use href="#fish-icon" x="55" y="50"/>
    <use href="#fish-icon" x="35" y="80"/><use href="#fish-icon" x="55" y="80"/>
    <text x="45" y="140" class="lbl">B</text>
    <text x="45" y="160" class="count-txt">(4)</text>
  </g>
  <!-- Balde C (5 peixes) -->
  <g transform="translate(270, 30)">
    <polygon points="10,20 80,20 70,110 20,110" class="bucket"/>
    <use href="#fish-icon" x="35" y="45"/><use href="#fish-icon" x="55" y="45"/>
    <use href="#fish-icon" x="45" y="65"/>
    <use href="#fish-icon" x="35" y="85"/><use href="#fish-icon" x="55" y="85"/>
    <text x="45" y="140" class="lbl">C</text>
    <text x="45" y="160" class="count-txt">(5)</text>
  </g>
  <!-- Balde D (6 peixes) -->
  <g transform="translate(390, 30)">
    <polygon points="10,20 80,20 70,110 20,110" class="bucket"/>
    <use href="#fish-icon" x="35" y="45"/><use href="#fish-icon" x="55" y="45"/>
    <use href="#fish-icon" x="35" y="65"/><use href="#fish-icon" x="55" y="65"/>
    <use href="#fish-icon" x="35" y="85"/><use href="#fish-icon" x="55" y="85"/>
    <text x="45" y="140" class="lbl">D</text>
    <text x="45" y="160" class="count-txt">(6)</text>
  </g>
  <!-- Balde E (8 peixes) -->
  <g transform="translate(510, 30)">
    <polygon points="10,20 80,20 70,110 20,110" class="bucket"/>
    <use href="#fish-icon" x="35" y="40"/><use href="#fish-icon" x="55" y="40"/>
    <use href="#fish-icon" x="35" y="55"/><use href="#fish-icon" x="55" y="55"/>
    <use href="#fish-icon" x="35" y="70"/><use href="#fish-icon" x="55" y="70"/>
    <use href="#fish-icon" x="35" y="85"/><use href="#fish-icon" x="55" y="85"/>
    <text x="45" y="140" class="lbl">E</text>
    <text x="45" y="160" class="count-txt">(8)</text>
  </g>
</svg>