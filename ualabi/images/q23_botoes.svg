<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" width="100%" height="100%">
  <defs>
    <style>
      .screen { fill: #0f172a; stroke: #334155; stroke-width: 6; rx: 12; }
      .btn-bg { fill: #1e293b; stroke: #475569; stroke-width: 3; rx: 8; }
      .tri { fill: #fbbf24; stroke: #d97706; stroke-width: 2; }
      .circ { fill: #38bdf8; stroke: #0284c7; stroke-width: 2; }
      .btn-lbl { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: #94a3b8; text-anchor: middle; }
    </style>
  </defs>
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="400" height="140" class="screen"/>
    <!-- Botão 1: Triângulo -->
    <rect x="25" y="25" width="70" height="70" class="btn-bg"/>
    <polygon points="60,40 40,75 80,75" class="tri"/>
    <text x="60" y="115" class="btn-lbl">B1</text>
    <!-- Botão 2: Círculo -->
    <rect x="115" y="25" width="70" height="70" class="btn-bg"/>
    <circle cx="150" cy="60" r="18" class="circ"/>
    <text x="150" y="115" class="btn-lbl">B2</text>
    <!-- Botão 3: Triângulo -->
    <rect x="205" y="25" width="70" height="70" class="btn-bg"/>
    <polygon points="240,40 220,75 260,75" class="tri"/>
    <text x="240" y="115" class="btn-lbl">B3</text>
    <!-- Botão 4: Círculo -->
    <rect x="295" y="25" width="70" height="70" class="btn-bg"/>
    <circle cx="330" cy="60" r="18" class="circ"/>
    <text x="330" y="115" class="btn-lbl">B4</text>
  </g>
</svg>