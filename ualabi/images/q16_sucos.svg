<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="100%" height="100%">
  <defs>
    <style>
      .cup-orange { fill: #fb923c; stroke: #c2410c; stroke-width: 2; }
      .cup-yellow { fill: #fde047; stroke: #ca8a04; stroke-width: 2; }
      .cup-purple { fill: #c084fc; stroke: #7e22ce; stroke-width: 2; }
      .txt { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>
  <!-- 1 copo Laranja -->
  <g transform="translate(40, 40)">
    <rect x="20" y="40" width="30" height="50" rx="3" class="cup-orange"/>
    <text x="35" y="115" class="txt">1 copo</text>
    <text x="35" y="135" class="txt" fill="#c2410c">Laranja</text>
  </g>
  <!-- 2 copos Maracujá -->
  <g transform="translate(170, 40)">
    <rect x="10" y="40" width="30" height="50" rx="3" class="cup-yellow"/>
    <rect x="50" y="40" width="30" height="50" rx="3" class="cup-yellow"/>
    <text x="45" y="115" class="txt">2 copos</text>
    <text x="45" y="135" class="txt" fill="#a16207">Maracujá</text>
  </g>
  <!-- 3 copos Uva -->
  <g transform="translate(310, 40)">
    <rect x="0" y="40" width="30" height="50" rx="3" class="cup-purple"/>
    <rect x="40" y="40" width="30" height="50" rx="3" class="cup-purple"/>
    <rect x="80" y="40" width="30" height="50" rx="3" class="cup-purple"/>
    <text x="55" y="115" class="txt">3 copos</text>
    <text x="55" y="135" class="txt" fill="#7e22ce">Uva</text>
  </g>
</svg>