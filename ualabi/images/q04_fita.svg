<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="100%" height="100%">
  <defs>
    <style>
      .grid { stroke: #e2e8f0; stroke-width: 1.5; }
      .tape { stroke: #1e3a8a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .star { fill: #eab308; stroke: #ca8a04; stroke-width: 2; }
      .lbl { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>
  <!-- Grade quadriculada 40px por unidade -->
  <g transform="translate(40, 30)">
    <!-- Linhas horizontais -->
    <line x1="0" y1="0" x2="440" y2="0" class="grid"/><line x1="0" y1="40" x2="440" y2="40" class="grid"/>
    <line x1="0" y1="80" x2="440" y2="80" class="grid"/><line x1="0" y1="120" x2="440" y2="120" class="grid"/>
    <line x1="0" y1="160" x2="440" y2="160" class="grid"/><line x1="0" y1="200" x2="440" y2="200" class="grid"/>
    <!-- Linhas verticais -->
    <line x1="0" y1="0" x2="0" y2="200" class="grid"/><line x1="40" y1="0" x2="40" y2="200" class="grid"/>
    <line x1="80" y1="0" x2="80" y2="200" class="grid"/><line x1="120" y1="0" x2="120" y2="200" class="grid"/>
    <line x1="160" y1="0" x2="160" y2="200" class="grid"/><line x1="200" y1="0" x2="200" y2="200" class="grid"/>
    <line x1="240" y1="0" x2="240" y2="200" class="grid"/><line x1="280" y1="0" x2="280" y2="200" class="grid"/>
    <line x1="320" y1="0" x2="320" y2="200" class="grid"/><line x1="360" y1="0" x2="360" y2="200" class="grid"/>
    
    <!-- Traçado da fita:
         Início (0, 80) -> D2: (80, 80) -> C3: (80, -40 = 0?)
         Vamos ajustar:
         Origem: (40, 120)
         D2 (2 unid = 80px): (120, 120)
         S3 (3 unid = 120px para cima): (120, 0)
         D1 (1 unid = 40px): (160, 0)
         B4 (4 unid = 160px para baixo): (160, 160) -> ESTRELA AQUI!
         D2 (2 unid = 80px): (240, 160)
         S2 (2 unid = 80px para cima): (240, 80)
    -->
    <polyline points="40,120 120,120 120,0 160,0 160,160 240,160 240,80" class="tape"/>
    <!-- Pontos marcados -->
    <circle cx="40" cy="120" r="5" fill="#1e3a8a"/>
    <text x="25" y="115" class="lbl">0</text>
    <circle cx="240" cy="80" r="5" fill="#1e3a8a"/>
    <text x="255" y="85" class="lbl">14</text>
    <!-- Estrela em (160, 160) -->
    <g transform="translate(160, 160)">
      <polygon points="0,-14 4,-4 14,-4 6,2 9,12 0,6 -9,12 -6,2 -14,-4 -4,-4" class="star"/>
      <text x="20" y="8" class="lbl" fill="#ca8a04">★</text>
    </g>
  </g>
</svg>