<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="100%" height="100%">
  <defs>
    <style>
      .t-cell { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; }
      .num { font-family: 'Arial', sans-serif; font-size: 22px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .arr-obs { stroke: #dc2626; stroke-width: 4; marker-end: url(#arr-south); fill: none; }
      .lbl { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #dc2626; text-anchor: middle; }
    </style>
    <marker id="arr-south" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>
  <g transform="translate(60, 30)">
    <!-- Linha 1 (Norte) -->
    <rect x="0" y="0" width="60" height="60" class="t-cell"/><text x="30" y="30" class="num">4</text>
    <rect x="60" y="0" width="60" height="60" class="t-cell"/><text x="90" y="30" class="num">8</text>
    <rect x="120" y="0" width="60" height="60" class="t-cell"/><text x="150" y="30" class="num">8</text>
    <rect x="180" y="0" width="60" height="60" class="t-cell"/><text x="210" y="30" class="num">6</text>
    <!-- Linha 2 -->
    <rect x="0" y="60" width="60" height="60" class="t-cell"/><text x="30" y="90" class="num">2</text>
    <rect x="60" y="60" width="60" height="60" class="t-cell"/><text x="90" y="90" class="num">6</text>
    <rect x="120" y="60" width="60" height="60" class="t-cell"/><text x="150" y="90" class="num">6</text>
    <rect x="180" y="60" width="60" height="60" class="t-cell"/><text x="210" y="90" class="num">8</text>
    <!-- Linha 3 -->
    <rect x="0" y="120" width="60" height="60" class="t-cell"/><text x="30" y="150" class="num">6</text>
    <rect x="60" y="120" width="60" height="60" class="t-cell"/><text x="90" y="150" class="num">4</text>
    <rect x="120" y="120" width="60" height="60" class="t-cell"/><text x="150" y="150" class="num">2</text>
    <rect x="180" y="120" width="60" height="60" class="t-cell"/><text x="210" y="150" class="num">4</text>
    <!-- Linha 4 (Sul / Frente) -->
    <rect x="0" y="180" width="60" height="60" class="t-cell"/><text x="30" y="210" class="num">2</text>
    <rect x="60" y="180" width="60" height="60" class="t-cell"/><text x="90" y="210" class="num">2</text>
    <rect x="120" y="180" width="60" height="60" class="t-cell"/><text x="150" y="210" class="num">4</text>
    <rect x="180" y="180" width="60" height="60" class="t-cell"/><text x="210" y="210" class="num">6</text>

    <!-- Setas de Observação ao Sul -->
    <line x1="30" y1="280" x2="30" y2="250" class="arr-obs"/>
    <line x1="90" y1="280" x2="90" y2="250" class="arr-obs"/>
    <line x1="150" y1="280" x2="150" y2="250" class="arr-obs"/>
    <line x1="210" y1="280" x2="210" y2="250" class="arr-obs"/>
    <text x="120" y="310" class="lbl">Visão de Frente (Sul)</text>
  </g>
</svg>