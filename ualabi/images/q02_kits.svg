<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 3; rx: 8; }
      .title { font-family: 'Arial', sans-serif; font-size: 15px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .item-txt { font-family: 'Arial', sans-serif; font-size: 14px; fill: #334155; }
      .arrow { stroke: #3b82f6; stroke-width: 4; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
    </marker>
  </defs>
  <!-- Caixa Estoque -->
  <rect x="30" y="20" width="280" height="180" class="box"/>
  <text x="170" y="45" class="title">Estoque de Componentes</text>
  <!-- Pilhas -->
  <rect x="50" y="65" width="28" height="16" fill="#fbbf24" stroke="#d97706" stroke-width="2" rx="3"/>
  <text x="90" y="78" class="item-txt"><strong>8</strong> Pilhas alcalinas</text>
  <!-- Motores -->
  <circle cx="64" cy="105" r="11" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <rect x="75" y="102" width="6" height="6" fill="#475569"/>
  <text x="90" y="110" class="item-txt"><strong>5</strong> Motores elétricos</text>
  <!-- Fios -->
  <path d="M50,140 Q64,130 78,140" fill="none" stroke="#ef4444" stroke-width="3"/>
  <text x="90" y="142" class="item-txt"><strong>12</strong> Fios conectores</text>
  <!-- Interruptores -->
  <rect x="52" y="165" width="24" height="14" fill="#10b981" stroke="#047857" stroke-width="2" rx="2"/>
  <text x="90" y="176" class="item-txt"><strong>6</strong> Interruptores</text>
  <!-- Seta -->
  <line x1="330" y1="110" x2="380" y2="110" class="arrow"/>
  <!-- Caixa Kit Robô -->
  <rect x="400" y="20" width="170" height="180" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="485" y="45" class="title" fill="#1d4ed8">1 Robô Precisa de:</text>
  <text x="430" y="80" class="item-txt">• 1 Pilha</text>
  <text x="430" y="110" class="item-txt">• 1 Motor</text>
  <text x="430" y="140" class="item-txt">• 2 Fios</text>
  <text x="430" y="170" class="item-txt">• 1 Interruptor</text>
</svg>