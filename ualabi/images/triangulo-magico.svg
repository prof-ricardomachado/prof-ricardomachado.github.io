<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="100%" height="100%">
  <defs>
    <style>
      .t-line { stroke: #4a5568; stroke-width: 4; fill: none; }
      .v-circle { fill: #fed7d7; stroke: #e53e3e; stroke-width: 3; }
      .m-circle { fill: #edf2f7; stroke: #718096; stroke-width: 3; }
      .v-txt { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #9b2c2c; text-anchor: middle; dominant-baseline: central; }
      .sum-lbl { font-family: 'Arial', sans-serif; font-size: 15px; font-weight: bold; fill: #2b6cb0; text-anchor: middle; }
    </style>
  </defs>

  <!-- Lados do Triângulo -->
  <polygon points="190,40 50,280 330,280" class="t-line"/>

  <!-- Indicações de Soma = 12 -->
  <text x="95" y="140" class="sum-lbl" transform="rotate(-60 95 140)">Soma = 12</text>
  <text x="285" y="140" class="sum-lbl" transform="rotate(60 285 140)">Soma = 12</text>
  <text x="190" y="315" class="sum-lbl">Soma = 12</text>

  <!-- Círculos nos Meios dos Lados -->
  <circle cx="120" cy="160" r="22" class="m-circle"/>
  <circle cx="260" cy="160" r="22" class="m-circle"/>
  <circle cx="190" cy="280" r="22" class="m-circle"/>

  <!-- Vértices A, B, C -->
  <!-- Vértice Topo (A) -->
  <circle cx="190" cy="40" r="25" class="v-circle"/>
  <text x="190" y="40" class="v-txt">A</text>

  <!-- Vértice Esquerdo (B) -->
  <circle cx="50" cy="280" r="25" class="v-circle"/>
  <text x="50" y="280" class="v-txt">B</text>

  <!-- Vértice Direito (C) -->
  <circle cx="330" cy="280" r="25" class="v-circle"/>
  <text x="330" y="280" class="v-txt">C</text>
</svg>
