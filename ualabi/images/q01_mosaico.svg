<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="100%" height="100%">
  <defs>
    <style>
      .grid-line { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4,4; }
      .box-frame { fill: #f8fafc; stroke: #1e293b; stroke-width: 4; }
      .p-yellow { fill: #fde047; stroke: #ca8a04; stroke-width: 2; }
      .p-blue { fill: #38bdf8; stroke: #0284c7; stroke-width: 2; }
      .p-red { fill: #f87171; stroke: #dc2626; stroke-width: 2; }
      .p-target { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .opt-box { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
      .opt-shape { fill: #a855f7; stroke: #7e22ce; stroke-width: 2; }
      .label { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .qmark { font-family: 'Arial', sans-serif; font-size: 32px; font-weight: bold; fill: #64748b; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <!-- Quadro 4x4 -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="200" height="200" class="box-frame"/>
    <!-- Linhas internas -->
    <line x1="50" y1="0" x2="50" y2="200" class="grid-line"/>
    <line x1="100" y1="0" x2="100" y2="200" class="grid-line"/>
    <line x1="150" y1="0" x2="150" y2="200" class="grid-line"/>
    <line x1="0" y1="50" x2="200" y2="50" class="grid-line"/>
    <line x1="0" y1="100" x2="200" y2="100" class="grid-line"/>
    <line x1="0" y1="150" x2="200" y2="150" class="grid-line"/>
    <!-- Peça Amarela: Topo 4x1 -->
    <rect x="0" y="0" width="200" height="50" class="p-yellow"/>
    <!-- Peça Azul: Lateral Esquerda 1x3 (de y=50 a 200) -->
    <rect x="0" y="50" width="50" height="150" class="p-blue"/>
    <!-- Peça Vermelha: Canto Inf-Dir 2x2 (x=100..200, y=100..200) -->
    <rect x="100" y="100" width="100" height="100" class="p-red"/>
    <!-- Vão vazio: (50,50), (100,50), (150,50), (50,100), (50,150) -> Formato de L de 5 blocos -->
    <text x="100" y="75" class="qmark">?</text>
  </g>
  <!-- Divisor -->
  <line x1="260" y1="20" x2="260" y2="240" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Opções -->
  <g transform="translate(290, 40)">
    <!-- Opção A: Cruz -->
    <g transform="translate(0, 0)">
      <polygon points="20,0 40,0 40,20 60,20 60,40 40,40 40,60 20,60 20,40 0,40 0,20 20,20" class="opt-shape"/>
      <text x="30" y="80" class="label">(A)</text>
    </g>
    <!-- Opção B: Barra 1x5 -->
    <g transform="translate(75, 0)">
      <rect x="0" y="20" width="60" height="12" class="opt-shape"/>
      <text x="30" y="80" class="label">(B)</text>
    </g>
    <!-- Opção C: L de 5 blocos (Correta) -->
    <g transform="translate(150, 0)">
      <polygon points="0,0 60,0 60,20 20,20 20,60 0,60" class="opt-shape" fill="#10b981" stroke="#047857"/>
      <text x="30" y="80" class="label">(C)</text>
    </g>
    <!-- Opção D: 2x2 + 1 -->
    <g transform="translate(230, 0)">
      <polygon points="0,0 40,0 40,20 60,20 60,40 0,40" class="opt-shape"/>
      <text x="30" y="80" class="label">(D)</text>
    </g>
    <!-- Opção E: Escada -->
    <g transform="translate(110, 100)">
      <polygon points="0,40 0,60 60,60 60,20 40,20 40,40" class="opt-shape"/>
      <text x="30" y="80" class="label">(E)</text>
    </g>
  </g>
</svg>